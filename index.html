<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14181c">
<title>日本の運転れんしゅう</title>
<meta name="description" content="左側通行・日本の標識・教習所コースを安全な画面で練習。外国の方・ペーパードライバー・免許を取りたい人向け。6言語（日本語・やさしい日本語・English・Tiếng Việt・中文・Bahasa Indonesia）。">
<meta property="og:type" content="website">
<meta property="og:title" content="日本の運転れんしゅう / Japan Driving Practice">
<meta property="og:description" content="左側通行・標識・教習所コース・交通ルール問題集・危険予測。6言語対応の運転練習アプリ（学習用）。">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 38'%3E%3Cpath d='M15 38 0 26V0l15 12z' fill='%23f4c430'/%3E%3Cpath d='M15 38l15-12V0L15 12z' fill='%233fb36b'/%3E%3C/svg%3E">
<style>
/* 構成：タイトル（車両・入口）→ 運転画面（上方ビュー＋運転席ビュー、案内、操作盤）／クイズ／ルールブック */
:root{
  --bg:#14181c;--panel:#1d2329;--panel2:#262e35;--line:#36414a;--ink:#eef1ee;--mute:#9aa5ad;
  --yel:#f4c430;--red:#e5493c;--grn:#3fb36b;--blu:#4e9be0;--wak:#8bc34a;
  --f:"Hiragino Sans","Noto Sans JP","Yu Gothic UI","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
  --num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{padding:10px max(12px,env(safe-area-inset-right)) 24px max(12px,env(safe-area-inset-left));overscroll-behavior:none;touch-action:manipulation}
body,body *{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
.app{max-width:1240px;margin:0 auto}
h1,h2,h3{margin:0;line-height:1.25}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-size:14px}
.btn.pri{background:#2b4d39;border-color:var(--grn)}
.btn[aria-pressed=true]{border-color:var(--yel);color:var(--yel)}
.muted{color:var(--mute)}

/* ---------- タイトル ---------- */
.hero{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 20px 18px;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:repeating-linear-gradient(90deg,#fff 0 26px,transparent 26px 44px);opacity:.75}
.hero h1{font-size:clamp(24px,5vw,38px);letter-spacing:.02em;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wakaba{width:30px;height:38px;flex:none}
.hero p{margin:6px 0 0;color:var(--mute);max-width:52em}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.langs button{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:14px}
.langs button[aria-pressed=true]{background:#3a3418;border-color:var(--yel);color:var(--yel)}
.sec{margin-top:14px}
.sec>h2{font-size:13px;color:var(--mute);letter-spacing:.08em;margin:0 0 8px;font-weight:600}
.vehicles{display:flex;gap:8px;flex-wrap:wrap}
.veh{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.veh[aria-pressed=true]{border-color:var(--grn);background:#1f3327}
.veh[disabled]{opacity:.5;cursor:not-allowed}
.veh small{font-size:11px;color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:0 6px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{text-align:left;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--blu);border-radius:8px;padding:12px 14px;display:grid;gap:4px;min-height:92px}
.card b{font-size:17px}
.card span{font-size:13px;color:var(--mute)}
.card.c-learn{border-left-color:var(--wak)}.card.c-exam{border-left-color:var(--red)}.card.c-free{border-left-color:var(--blu)}
.card.c-quiz{border-left-color:var(--yel)}.card.c-book{border-left-color:#9b7fd1}
.note{margin-top:14px;font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:10px}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}

/* ---------- 一覧（レッスン・検定） ---------- */
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.head h2{font-size:20px}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.item .no{font-family:var(--num);font-size:20px;color:var(--wak);width:2ch;flex:none}
.item .tx{flex:1;min-width:0}.item .tx b{display:block}.item .tx span{font-size:13px;color:var(--mute)}
.item .st{color:var(--yel);letter-spacing:2px;flex:none}

/* ---------- 運転画面 ---------- */
.bar{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.bar .ttl{font-weight:700;font-size:15px;min-width:0;flex:1 1 160px}
.stats{display:flex;gap:4px 16px;flex-wrap:wrap}
.stat{display:grid;line-height:1.15}
.stat .k{font-size:11px;color:var(--mute)}
.stat .v{font-family:var(--num);font-size:19px;font-variant-numeric:tabular-nums}
.stat .v.bad{color:var(--red)}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stage[data-view=cab]{grid-template-columns:1fr}.stage[data-view=cab] #fTop{display:none}
.stage[data-view=top]{grid-template-columns:1fr}.stage[data-view=top] #fCab{display:none}
.view{margin:0;background:#0d1013;border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0;position:relative}
.view figcaption{position:absolute;left:8px;top:6px;font-size:11px;color:#dfe5e8;background:rgba(0,0,0,.45);padding:1px 7px;border-radius:4px;pointer-events:none}
.view canvas{display:block;width:100%;aspect-ratio:16/10;touch-action:none}
.guide{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--grn);border-radius:8px;padding:8px 12px;margin-top:8px;min-height:64px}
.guide[data-tone=warn]{border-left-color:var(--red)}
.gIcon{font-size:30px;width:42px;height:42px;display:grid;place-items:center;background:#24402f;border-radius:8px;flex:none;line-height:1}
.gMain{font-size:16px;font-weight:700}
.gSub{font-size:13.5px;color:var(--mute);min-height:1.4em}
.gSub.warn{color:#ff8a7e;font-weight:700}
.deck{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr) minmax(0,1fr);gap:8px;margin-top:8px}
.cl{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:6px;align-content:start;min-width:0}
.cl .ct{font-size:11px;color:var(--mute);letter-spacing:.06em}
.gears{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.gears button,.k2{background:var(--panel2);border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;padding:8px 2px;font-weight:700;font-size:16px;min-height:44px}
.gears button[aria-pressed=true]{background:#3a3418;border-color:var(--yel);color:var(--yel)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.k2{font-size:13px;font-weight:600;line-height:1.2}
.k2[aria-pressed=true]{border-color:var(--yel);color:var(--yel);background:#3a3418}
.k2.on-g[aria-pressed=true]{border-color:var(--grn);color:#bff0cf;background:#1f3a29}
.k2.on-r[aria-pressed=true]{border-color:var(--red);color:#ffc9c2;background:#3d2020}
.wheelBox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center}.wheelBox>div{min-width:0}.k2{min-width:0;overflow-wrap:anywhere}
#cWheel{width:128px;height:128px;touch-action:none;display:block}
.pedals{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;align-items:end;height:100%}
.ped{border:1px solid var(--line);border-radius:8px;display:grid;place-items:end center;padding:8px 4px;font-weight:700;font-size:14px;touch-action:none;position:relative;overflow:hidden}
.ped i{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(255,255,255,.14);pointer-events:none}
.ped.brake{height:120px;background:#3a2020;border-color:#7a3b35}
.ped.acc{height:150px;background:#1f3326;border-color:#3e6b4c}
.ped small{display:block;font-size:10px;color:var(--mute);font-weight:500}
.keys{font-size:12px;color:var(--mute);margin-top:6px}
kbd{font-family:var(--num);background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:0 4px}
/* 横向きのスマホ：画面と操作を左右に */
@media (orientation:landscape) and (max-height:540px){
  body{padding-top:4px;padding-bottom:4px}
  .drv{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:6px;align-items:start}
  .drv .bar{grid-column:1/-1;margin:0;padding:4px 8px}
  .drv .bar .stat .v{font-size:16px}
  .stage{grid-template-columns:1fr!important}
  .stage:not([data-view=top]) #fTop{display:none}
  .stage[data-view=top] #fCab{display:none}
  .view canvas{aspect-ratio:auto;height:calc(100svh - 150px)}
  .guide{margin-top:6px;min-height:0;padding:4px 8px}.gIcon{width:32px;height:32px;font-size:22px}.gMain{font-size:14px}.gSub{font-size:12px}
  .deck{grid-template-columns:1.3fr 1fr;grid-template-areas:"g p" "w p";margin-top:0;gap:6px}
  .deck>.cl:nth-child(1){grid-area:g}.deck>.cl.wh{grid-area:w}.deck>.cl:nth-child(3){grid-area:p}
  .cl{padding:6px;gap:4px}.cl .ct{display:none}
  #cWheel{width:84px;height:84px}.wheelBox .muted{display:none}
  .pedals{height:100%}.ped.brake{height:calc(100svh - 120px);max-height:200px}.ped.acc{height:calc(100svh - 90px);max-height:240px}
  .gears button,.k2{min-height:32px;padding:4px 2px;font-size:12px}.gears button{font-size:15px}
  .bar .btn{padding:4px 8px;font-size:13px}
  .keys{display:none}
}
@media (max-width:760px) and (orientation:portrait){
  body{padding-top:6px}
  .bar{padding:5px 8px;gap:4px 10px;margin-bottom:6px}.bar .btn{padding:4px 8px;font-size:13px}.bar .ttl{font-size:14px}.stat .v{font-size:16px}
  .stage{grid-template-columns:1fr;gap:6px}
  #cTop{aspect-ratio:16/8}
  .guide{margin-top:6px;min-height:0;padding:6px 10px}.gIcon{width:34px;height:34px;font-size:24px}.gMain{font-size:14px;line-height:1.35}.gSub{font-size:12.5px}
  .deck{grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
  .deck .cl.wh{grid-column:1/-1;order:-1}
  .cl{padding:6px;gap:5px}
  #cWheel{width:100px;height:100px}.wheelBox .muted{display:none}
  .gears button,.k2{min-height:38px;font-size:12px;padding:4px 2px}.gears button{font-size:16px}
  .ped.brake{height:112px}.ped.acc{height:140px}
  .keys{display:none}
}

/* ---------- クイズ ---------- */
.quiz{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;max-width:760px;margin:0 auto}
.qmeta{display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
.qfig{display:grid;place-items:center;background:#e9ece8;border-radius:8px;padding:8px}
.qfig.dark{background:#1a2026}
.qfig canvas{width:min(100%,420px);height:auto;display:block}
.qq{font-size:18px;font-weight:700}
.choices{display:grid;gap:8px}
.choices button{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:15px}
.choices button.ok{border-color:var(--grn);background:#1f3a29}
.choices button.ng{border-color:var(--red);background:#3d2020}
.fb{border-left:5px solid var(--grn);background:#1b2a21;padding:8px 12px;border-radius:6px}
.fb.ng{border-left-color:var(--red);background:#2b1d1d}
.fb b{display:block;margin-bottom:2px}
/* ---------- ルールブック ---------- */
.book{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.bk{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;gap:6px;align-content:start}
.bk canvas{width:84px;height:84px;background:#e9ece8;border-radius:6px}
.bk b{font-size:15px}
.bk p{margin:0;font-size:13.5px;color:#cfd6da}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
/* ---------- モーダル ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:20}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:520px;width:100%;max-height:90svh;overflow:auto;display:grid;gap:10px}
.mbox h3{font-size:24px}
.mbox .big{font-family:var(--num);font-size:42px}
.mbox ul{margin:0;padding-left:1.2em;font-size:14px}
.mbox .btns{display:flex;gap:8px;flex-wrap:wrap}
.set{display:grid;gap:8px}
.set label{display:flex;gap:8px;align-items:center;font-size:14px}
.set input[type=range]{flex:1}
/* ---------- キー操作 ---------- */
.keyBar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:8px}
.kg{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.kg>b{font-size:11px;color:var(--mute);letter-spacing:.06em;margin-right:2px}
.ki{display:inline-flex;gap:3px;align-items:center;font-size:12.5px;white-space:nowrap}
.cap{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 5px;background:#e9edf0;color:#15191c;border-radius:4px;border-bottom:3px solid #9aa5ad;font-family:var(--num);font-size:12.5px;font-weight:700}
.cap.on{background:var(--yel)}
.keyTbl{width:100%;border-collapse:collapse;font-size:14px}
.keyTbl td{padding:5px 4px;border-bottom:1px solid var(--line)}
.keyTbl td:first-child{white-space:nowrap}
.keyTbl button.slot{min-width:72px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-family:var(--num);font-weight:700}
.keyTbl button.slot.wait{border-color:var(--yel);color:var(--yel);animation:hlp 1s infinite}
@keyframes hlp{50%{opacity:.4}}
.keyTbl tr.grp td{color:var(--mute);font-size:12px;padding-top:10px;border-bottom:none}
.kmsg{min-height:1.4em;font-size:13px;color:var(--yel)}
@media (max-width:760px),(orientation:landscape) and (max-height:540px){.keyBar{display:none}}
[data-kk]{position:relative}
@media (hover:hover) and (pointer:fine){[data-kk]:not([data-kk=""])::after{content:attr(data-kk);position:absolute;right:4px;top:3px;font-family:var(--num);font-size:10px;font-weight:700;color:#15191c;background:#cfd6da;border-radius:3px;padding:0 4px;line-height:1.5}}
/* ---------- 公道 ---------- */
.card.c-road{border-left-color:#3fb3a6}
.rwrap{display:grid;gap:10px}
.rbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px}
.rrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rrow input{flex:1 1 200px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:7px 10px;font-size:15px;min-width:0}
.rlist{display:grid;gap:6px;max-height:300px;overflow:auto}
#rMap{width:100%;aspect-ratio:4/3;max-height:70svh;border-radius:8px;touch-action:none;background:#2c3e27;cursor:crosshair}
.kmsg.warn{color:#ff8a7e}
/* ---------- 教習所モード ---------- */
.card.c-school{border-left-color:#e05a8a;background:linear-gradient(100deg,#2a1f28,#1d2329 60%)}
.card.c-school b{font-size:19px}
.schTop{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.schTop svg{flex:none}
.schTop p{margin:2px 0 0}
.bubble{position:relative;background:#f6f3ea;color:#1d1d1d;border-radius:10px;padding:8px 12px;font-weight:600}
.schName{display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap;font-size:14px}
.schName input{background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:6px 10px;font-size:15px;min-width:0;flex:1 1 160px;max-width:280px}
.genbo{display:grid;gap:12px}
.genbo h3{font-size:14px;color:var(--mute);margin:4px 0 6px;letter-spacing:.06em}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cell{position:relative;text-align:left;background:#efe9da;color:#2a2620;border:1px solid #cdbf9f;border-radius:6px;padding:8px 56px 8px 10px;min-height:78px;display:grid;align-content:start;gap:2px}
.cell .n{font-family:var(--num);font-size:12px;color:#7a6d55}
.cell b{font-size:13.5px;line-height:1.3}
.cell[disabled]{opacity:.45;cursor:not-allowed}
.cell .sub{font-size:12px;color:#6b5d3e;line-height:1.35}.cell .lock{font-size:12px;color:#7a6d55}
.stamp{position:absolute;right:6px;bottom:6px;width:46px;height:46px;border:2.5px solid #c8231b;border-radius:50%;color:#c8231b;display:grid;place-items:center;font-size:11px;font-weight:800;line-height:1.05;text-align:center;transform:rotate(-12deg);background:rgba(255,255,255,.25)}
.stamp.big{position:static;width:88px;height:88px;font-size:18px;border-width:4px;margin:4px auto;animation:stampIn .45s ease-out}
@keyframes stampIn{0%{transform:scale(2.2) rotate(-30deg);opacity:0}70%{transform:scale(.92) rotate(-10deg);opacity:1}100%{transform:scale(1) rotate(-12deg)}}
.cert{background:linear-gradient(135deg,#fdf8e8,#efe3c1);color:#2a2620;border:2px solid #b89a52;border-radius:12px;padding:16px;display:grid;gap:6px;max-width:420px}
.cert h4{margin:0;font-size:20px;display:flex;gap:8px;align-items:center}
.cert small{color:#6b5d3e}
.inst{display:flex;gap:8px;align-items:center;margin-top:6px}
.inst .bubble{font-size:14px;padding:5px 10px;flex:1}
.mInst{display:flex;gap:10px;align-items:center}
.mInst .bubble{flex:1}
</style>
</head>
<body>
<div class="app" id="app">

<!-- ===== タイトル ===== -->
<section id="scTitle">
  <div class="hero">
    <h1><svg class="wakaba" viewBox="0 0 30 38" aria-hidden="true"><path d="M15 38 0 26V0l15 12z" fill="#f4c430"/><path d="M15 38l15-12V0L15 12z" fill="#3fb36b"/></svg><span data-i="title"></span></h1>
    <p data-i="sub"></p>
    <div class="langs" id="langs"></div>
  </div>
  <div class="sec"><h2 data-i="vehicle"></h2><div class="vehicles" id="vehicles"></div></div>
  <div class="sec"><h2 data-i="drive"></h2>
    <div class="cards">
      <button class="card c-school" data-go="school"><b data-i="school"></b><span data-i="schoolD"></span></button>
      <button class="card c-road" data-go="road"><b data-i="road"></b><span data-i="roadD"></span></button>
      <button class="card c-learn" data-go="lessons"><b data-i="learn"></b><span data-i="learnD"></span></button>
      <button class="card c-exam" data-go="exams"><b data-i="exam"></b><span data-i="examD"></span></button>
      <button class="card c-free" data-go="free"><b data-i="free"></b><span data-i="freeD"></span></button>
    </div>
  </div>
  <div class="sec"><h2 data-i="study"></h2>

  for(const p of POLES)if(hitCircle(x,y,a,p.x,p.y,p.r))return 'touch';

  const T=trainInfo();if(T.tx!=null&&Math.abs(y-30)<7){const C=bodyPts(x,y,a);if(C.some(([px,py])=>px>T.t0&&px<T.t1&&py>28.6&&py<31.4))return 'crash';for(let px=Math.max(T.t0,x-6);px<=Math.min(T.t1,x+6);px+=0.5)for(const py of [28.6,31.4])if(hitCircle(x,y,a,px,py,0.05))return 'crash';}

function tick(dt){
  if(!G||G.over){return;}
  G.time+=dt;worldTick(dt);
  // ペダル
  const accK=act('accel'),brkK=act('brake');
  const accT=PED.acc!=null?PED.acc:(accK?1:0),brkT=PED.brk!=null?PED.brk:(brkK?1:0);
  G.thr+=(accT>G.thr?Math.min(accT-G.thr,(PED.acc!=null?4:1.3)*dt):Math.max(accT-G.thr,-5*dt));
  G.brk+=(brkT>G.brk?Math.min(brkT-G.brk,(PED.brk!=null?5:1.8)*dt):Math.max(brkT-G.brk,-6*dt));
  // ハンドル
  const stK=(act('left')?-1:0)+(act('right')?1:0);
  if(act('center')){const r=720*dt;G.wheel=Math.abs(G.wheel)<r?0:G.wheel-Math.sign(G.wheel)*r;}
  if(stK){G.wheel=clamp(G.wheel+stK*420*SET.sens*dt,-540,540);G.keySteer=true;}
  else if(!WHEEL.held&&Math.abs(G.v)>0.3&&!(SET.keyHold&&G.keySteer)){const r=(40+Math.abs(G.v)*45)*dt;G.wheel=Math.abs(G.wheel)<r?0:G.wheel-Math.sign(G.wheel)*r;}
  const dl=clamp(G.wheel/CAR.ratio*PI/180,-CAR.maxSt,CAR.maxSt);
  if(instOn()&&Math.abs(G.v)>0.6){const sg=Math.sign(G.v),look=G.v*G.v/(2*6)+Math.abs(G.v)*0.35+0.4;let px=G.x,py=G.y,pa=G.a,hitA=false;
    for(let d=0.4;d<=look;d+=0.4){px+=Math.cos(pa)*0.4*sg;py+=Math.sin(pa)*0.4*sg;pa+=0.4*sg/CAR.wb*Math.tan(dl);if(crashAhead(px,py,pa)){hitA=true;break;}}
    if(hitA){G.assistT=G.time+0.8;if(cool('assist',3))ev('assist');}}
  if(G.assistT>G.time){G.brk=1;G.thr=0;}
  // 前後の力
  let acc=0;const gr=G.gear;
  if(gr==='D'||gr==='R'){const dg=gr==='D'?1:-1,vv=G.v*dg;const drive=G.thr*(gr==='D'?3.2:2.0)*Math.max(0,1-vv/(gr==='D'?33:5.5));const creep=G.thr<0.05?Math.max(0,0.9*(1-vv/1.8)):0;acc+=dg*(drive+creep);}
  if(Math.abs(G.v)>0.01)acc-=Math.sign(G.v)*(0.12+0.0005*G.v*G.v);
  const bdec=G.brk*8.5+(G.pb?2.2:0)+(gr==='P'?30:0);
  const v0=G.v;
  if(v0===0&&bdec>=Math.abs(acc))G.v=0;
  else{G.v+=acc*dt;const dv=bdec*dt;if(bdec>0){if(Math.abs(G.v)<=dv&&Math.sign(G.v)!==Math.sign(acc||-G.v)*-1)G.v=0;else if(Math.abs(G.v)<=dv)G.v=0;else G.v-=Math.sign(G.v)*dv;}}
  if(Math.abs(G.v)<0.004&&bdec>0)G.v=0;
  if(G.brk>0.05)G.brkT=G.time;
  // 動く（後輪の中心が基準）
  const nx=G.x+Math.cos(G.a)*G.v*dt,ny=G.y+Math.sin(G.a)*G.v*dt,na=G.a+G.v/CAR.wb*Math.tan(dl)*dt;
  const hit=collide(nx,ny,na);
  if(hit){if(Math.abs(G.v)>0.15&&cool('hit',1.5)){ev(hit);sfx('bump');}G.v=0;}
  else{const ds=hyp(nx-G.x,ny-G.y);G.moved+=ds;G.x=nx;G.y=ny;G.a=na;G.trkD+=ds;
    if(G.trkD>0.35&&SET.track){G.trkD=0;G.tracks.push(tirePts(G.x,G.y,G.a));if(G.tracks.length>900)G.tracks.shift();}}
  // ウインカーの自動戻り
  if(G.wink){const d=Math.abs(angDiff(G.a,G.winkA));if(d>1.05&&Math.abs(G.wheel)<80){G.wink=null;}}
  // 視線
  if(G.time>G.lookUntil)G.look=0;G.lookYaw+=(G.look-G.lookYaw)*Math.min(1,dt*7);

/* ================= ルールの判定 ================= */
function rules(dt){
  const [fx,fy]=fr(G.a);const sp=Math.abs(G.v);
  // 脱輪
  const off=tirePts(G.x,G.y,G.a).some(([x,y])=>!inDrv(x,y));
  if(off&&!G.offAny){G.offAny=true;ev('off');}
  if(off){if(G.gear==='D'&&G.v>0)G.offRun+=G.v*dt;if(G.offRun>1.6&&cool('offrun',3))ev('offrun');}
  else if(G.offAny&&!off){G.offAny=false;G.offRun=0;}
  // シートベルト・パーキングブレーキ・発進
  if(G.moved>0.5&&!G.started){G.started=true;
    if(G.startCheck){if(!G.belt)ev('belt');if(!(G.wink==='R'||G.time-G.winkT<3&&G.lastWink==='R'))ev('startsig');if(G.time-Math.max(G.lookT.R,G.lookT.B)>10)ev('startlook');}
    else if(!G.belt)ev('belt');}
  if(G.pb&&sp>0.6&&cool('pb',8))ev('pb');
  // 速度
  if(!RW&&sp*3.6>45&&cool('speed',8))ev('speed');
  G.maxV=Math.max(G.maxV,sp);
  if(RW){roadRules(dt,fx,fy,sp);return;}
  // 停止線
  const Fx=G.x+fx*3.5,Fy=G.y+fy*3.5;const ti=trainInfo();
  for(const s of SL){const st=G.slState[s.id]||(G.slState[s.id]={pd:null,near:false,far:false,L:false,R:false});
    const lat=(Fx-s.cx)*s.ux+(Fy-s.cy)*s.uy, d=(Fx-s.cx)*s.dir[0]+(Fy-s.cy)*s.dir[1], al=fx*s.dir[0]+fy*s.dir[1];
    if(Math.abs(lat)>s.half+0.6||al<0.5||d<-14||d>4){st.pd=null;st.near=st.far=st.L=st.R=false;continue;}
    if(d<0&&d>-3.2&&sp<0.05)st.near=true;
    if(d<=-3.2&&d>-12&&sp<0.05)st.far=true;
    if(d<0&&d>-6&&sp<1.5){if(G.lookT.L>G.time-6)st.L=true;if(G.lookT.R>G.time-6)st.R=true;}
    if(st.pd!=null&&st.pd<0&&d>=0&&G.v>0){
      if(s.type==='signal'){if(sigState(s.ph)==='R')ev('red');}
      else if(s.type==='stop'){if(!st.near)ev(st.far?'stoppos':'nostop');else if(!(st.L&&st.R))ev('nolook');}
      else if(s.type==='rail'){if(ti.warn)ev('railin');else if(!st.near)ev('railstop');else if(!(st.L&&st.R))ev('nolook');}}
    st.pd=d;}
  // 横断歩道
  const P=W.ped;const onCW=carRectOverlap(CW.x0,CW.y0,CW.x1,CW.y1);
  if(onCW&&!G.onCW&&(P.s==='cross'||P.s==='wait'))ev('ped');
  G.onCW=onCW;
  // 左側通行
  const cx=G.x+fx*1.3,cy=G.y+fy*1.3;let wrong=false;
  if(sp>0.5&&!nearJ(cx,cy,11)){for(const s of SEGS){if(!s.two)continue;const along=(cx-s.ax)*s.dx+(cy-s.ay)*s.dy;if(along<0||along>s.L)continue;const offn=(cx-s.ax)*(-s.dy)+(cy-s.ay)*s.dx;if(Math.abs(offn)>s.w/2)continue;
    const al=fx*s.dx+fy*s.dy;if(Math.abs(al)<0.8)continue;const sg=al>0?1:-1;const left=-offn*sg;  // 進む向きの左側を＋に
    if(left<-0.35)wrong=true;break;}}
  G.rightT=wrong?G.rightT+dt:Math.max(0,G.rightT-dt*2);
  if(G.rightT>1.3&&cool('right',6))ev('right');
  // 自転車の横を通る
  const B=W.bike;if(B.on){const [l,s]=toLocal(B.x,B.y,G.x,G.y,G.a);const same=Math.sin(G.a)>0.7;
    if(same&&l>-0.9&&l<3.5&&Math.abs(s)<CAR.hw+0.3+1.0&&sp*3.6>20){if(!G.bikeFlag){G.bikeFlag=true;ev('bike');}}
    if(l<-6||l>12)G.bikeFlag=false;}}

function legTick(dt){
  const L=G.legs[G.leg];if(!L)return;const d=G.legData;
  if(RW&&L.idx!=null&&L.k!=='finish'&&L.k!=='stop'&&(G.rprog||0)>L.idx+2)return nextLeg();const [fx,fy]=fr(G.a);const cx=G.x+fx*1.3,cy=G.y+fy*1.3;
  if(L.kiri!=null&&G.gear==='R'&&G.prevGear!=='R'){d.rev=(d.rev||0)+1;if(d.rev>L.kiri)ev('kiri');}
  G.prevGear=G.gear;
  if(L.p){const dist=hyp(cx-L.p[0],cy-L.p[1]);
    if(L.sig&&!d.hinted&&MODE.kind==='lesson'&&dist<28&&dist>12&&G.wink!==L.sig){d.hinted=true;say('i_hintSig');}
    if(L.sig&&!d.sigDone){const pre=L.pre||15;if(d.startDist==null)d.startDist=dist;const lim=d.startDist<pre+2?Math.min(pre,5):pre;
      if(dist<lim){d.sigDone=true;if(G.wink!==L.sig)ev('sig');else if(lim===pre&&G.time-G.winkT<2.0)ev('siglate');}}
    if(L.k==='speed'){if(G.legStart==null)G.legStart=G.maxV=0;}
    if((L.k==='go'||L.k==='turn'||L.k==='speed')&&dist<(L.r||6))return nextLeg();
    if(L.k==='stop'&&dist<(L.sr||2.5)&&G.v===0)return nextLeg();
    if(L.k==='finish'&&dist<4.5&&G.v===0&&G.gear==='P'&&G.pb)return nextLeg();}
  if(L.k==='do'&&L.chk())return nextLeg();
  if((L.k==='garage'||L.k==='park')&&G.v===0){const b=BAYS[L.bay];const inB=bodyPts(G.x,G.y,G.a).every(([x,y])=>x>=b.x0-0.05&&x<=b.x1+0.05&&y>=b.y0-0.05&&y<=b.y1+0.05);
    const okA=L.k==='park'?Math.abs(Math.sin(G.a))<0.17:true;if(inB&&okA){sfx('ok');return nextLeg();}}}
function nextLeg(){const L=G.legs[G.leg];if(L&&L.k==='speed'&&G.maxV*3.6<L.min)ev('slow');
  G.leg++;G.legData={};if(L&&L.k==='speed')G.maxV=0;sfx('ok');
  const N=G.legs[G.leg];if(N&&N.k==='speed')G.maxV=0;
  const clean=G.events.length===(G.evAtLeg||0);G.evAtLeg=G.events.length;
  if(N){if(clean&&MODE.kind==='lesson'&&L&&L.k!=='do'&&Math.random()<0.5)say('i_good'+(1+Math.floor(Math.random()*3)));setTimeout(()=>{if(G&&!G.over&&G.legs[G.leg]===N)say(N.m,false,true);},MODE.kind==='lesson'&&clean?1400:200);}
  if(!N&&G.legs.length)endRun('done');}

/* ================= 開始・終了 ================= */
function startRun(mode){MODE=mode;let spawn,legs=[],title='';if(!mode.road)RW=null;
  if(mode.road){spawn=mode.spawnR;legs=mode.legsR;title=t('road')+'：'+(RW.label||'')+(mode.kind==='exam'?'（'+t('exam')+'）':'');}
  else if(mode.kind==='free'){spawn={...ST,gear:'P',pb:true,belt:false,startCheck:true};title=t('free');}
  else if(mode.kind==='exam'){spawn={...ST,gear:'P',pb:true,belt:false,startCheck:true};legs=mode.id==='A'?LEGS_A:LEGS_B;title=t('exam')+' '+t(mode.id==='A'?'courseA':'courseB');}
  else{const Ls=LESSONS.find(l=>l.id===mode.id);spawn=Ls.spawn;legs=Ls.legs;title=mode.id+'. '+t('ls'+mode.id);}
  G=newState(spawn);G.legs=legs;G.prevGear=G.gear;if(mode.road)trafficInit(RW);else TF=null;
  W.bike.on=mode.kind==='free'||(mode.kind==='lesson'&&mode.id===10);W.bike.y=mode.kind==='lesson'?spawn.y+16:30;W.bike.x=14.9;
  if(mode.kind==='lesson'&&mode.id===5){W.train.t=-14;}
  W.ped.s='walk';W.ped.t=0;
  $('#dTitle').textContent=title;$('#stScoreW').hidden=mode.kind!=='exam';
  show('scDrive');resize();syncUI();INST.until=0;stopSpeak();
  if(instOn()){say(mode.kind==='exam'?'i_examStart':'i_hello');const L0=G.legs[0];if(L0)setTimeout(()=>{if(G&&G.leg===0&&!G.over)say(L0.m,false,true);},1600);}}
function endRun(kind,reason){if(G.over)return;G.over=true;G.endKind=kind;G.endReason=reason;sfx(kind==='done'?'win':'pen');
  if(MODE.school)return schoolEnd(kind,reason);
  let head,big='',col;
  if(MODE.kind==='exam'){if(kind==='stopped'){head=t('stopped');col='var(--red)';big='—';}else{const ok=G.score>=70;head=t(ok?'pass':'fail');col=ok?'var(--grn)':'var(--red)';big=G.score+' '+t('pts');}}
  else{head=t('done');col='var(--grn)';const n=G.events.length;big=n===0?'★★★':n<=2?'★★☆':'★☆☆';
    if(MODE.kind==='lesson'){const p=PROG['L'+MODE.id]||0;const s=n===0?3:n<=2?2:1;if(s>p){PROG['L'+MODE.id]=s;store.set('jdp_prog',PROG);}}}
  if(MODE.kind==='exam'&&kind!=='stopped'){const b=PROG['E'+MODE.id]||0;if(G.score>b){PROG['E'+MODE.id]=G.score;store.set('jdp_prog',PROG);}}
  const cnt={};G.events.forEach(k=>cnt[k]=(cnt[k]||0)+1);
  const items=Object.keys(cnt).map(k=>`<li>${t('ev_'+k)}${cnt[k]>1?' ×'+cnt[k]:''}${MODE.kind==='exam'&&EV[k][0]?`（−${EV[k][0]*cnt[k]}）`:''}</li>`).join('');
  const nextBtn=MODE.kind==='lesson'&&MODE.id<10?`<button class="btn pri" id="mNext">${t('nextL')}</button>`:'';
  openModal(`<h3 style="color:${col}">${head}</h3><div class="big">${big}</div>${reason?`<div>${t('reason',t('ev_'+reason))}</div>`:''}<b>${t('mistakes')}</b>${items?`<ul>${items}</ul>`:`<div class="muted">${t('none')}</div>`}<div class="btns">${nextBtn}<button class="btn" id="mAgain">${t('again')}</button><button class="btn" id="mMenu">${t('toMenu')}</button></div>`);
  $('#mAgain').onclick=()=>{closeModal();startRun(MODE);};$('#mMenu').onclick=()=>{closeModal();goBack();};
  if(nextBtn)$('#mNext').onclick=()=>{closeModal();startRun({kind:'lesson',id:MODE.id+1});};}

function captureKey(e){if(!KCAP)return false;e.preventDefault();e.stopPropagation();const {a,i}=KCAP;KCAP=null;let msg='';
  if(e.code==='Escape'){}else{const L=(KEYMAP[a]||[]).slice();

const PED={acc:null,brk:null};const WHEEL={held:false,last:0};
function pedal(el,key){const fill=el.querySelector('i');const set=e=>{const r=el.getBoundingClientRect();const k=clamp((e.clientY-r.top)/r.height,0,1);PED[key]=0.15+0.85*k;fill.style.height=(PED[key]*100)+'%';};
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}set(e);audioInit();});
  el.addEventListener('pointermove',e=>{if(PED[key]!=null)set(e);});
  const up=()=>{PED[key]=null;fill.style.height='0';};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);}
pedal($('#pAcc'),'acc');pedal($('#pBrk'),'brk');
{const c=$('#cWheel');const ang=e=>{const r=c.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/PI;};
 c.addEventListener('pointerdown',e=>{e.preventDefault();try{c.setPointerCapture(e.pointerId);}catch(_){}WHEEL.held=true;if(G)G.keySteer=false;WHEEL.last=ang(e);audioInit();});
 c.addEventListener('pointermove',e=>{if(!WHEEL.held||!G)return;const a=ang(e);let d=a-WHEEL.last;if(d>180)d-=360;if(d<-180)d+=360;WHEEL.last=a;G.wheel=clamp(G.wheel+d,-540,540);});

function shift(g){if(!G||G.over||G.gear===g)return;
  if(g!=='N'&&Math.abs(G.v)>0.4&&(g==='P'||g==='R'||G.gear==='R')){setSub(t('needStop'),true);return;}
  // ブレーキを踏んでいる（または直前3秒以内に踏んだ）ならそのまま。踏んでいなくても止まっていればシフトでき、アドバイスだけ出す
  const braked=G.brk>0.05||PED.brk!=null||act('brake')||G.time-(G.brkT||-99)<3;
  if((G.gear==='P'||g==='P'||g==='R'||g==='D')&&!braked){G.brk=Math.max(G.brk,1);setSub(t('tipBrake'),false);}
  G.gear=g;sfx('click');syncUI();}
function wink(s){if(!G)return;if(G.wink===s){G.wink=null;}else{G.wink=s;G.winkT=G.time;G.winkA=G.a;G.lastWink=s;}syncUI();}

let AC=null;function audioInit(){if(AC||!SET.sound)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function tone(f,d,type,vol,when){if(!AC||!SET.sound)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=vol||0.06;o.connect(g);g.connect(AC.destination);const t0=AC.currentTime+(when||0);g.gain.setValueAtTime(vol||0.06,t0);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.start(t0);o.stop(t0+d+0.02);}
function sfx(k){if(k==='pen'){tone(330,0.25,'square',0.05);tone(220,0.3,'square',0.05,0.18);}else if(k==='ok')tone(880,0.12,'sine',0.06);else if(k==='win'){tone(660,.15);tone(880,.15,'sine',.06,.15);tone(1100,.3,'sine',.06,.3);}else if(k==='bump')tone(90,0.25,'sawtooth',0.08);else if(k==='click')tone(1500,0.03,'square',0.03);else if(k==='tick')tone(2200,0.02,'square',0.02);else if(k==='bell')tone(900,0.12,'triangle',0.04);}

function shade(hex,k){const n=parseInt(hex.slice(1),16);const r=clamp(Math.round((n>>16&255)*k),0,255),g=clamp(Math.round((n>>8&255)*k),0,255),b=clamp(Math.round((n&255)*k),0,255);return '#'+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);}
function fitCanvas(c){const r=c.getBoundingClientRect();const dpr=Math.min(2,devicePixelRatio||1);const w=Math.max(10,Math.round(r.width*dpr)),h=Math.max(10,Math.round(r.height*dpr));if(c.width!==w||c.height!==h){c.width=w;c.height=h;}return [w,h,dpr];}

function drawTop(){const c=$('#cTop'),[W2,H2,dpr]=fitCanvas(c),x=c.getContext('2d');
  x.setTransform(1,0,0,1,0,0);x.fillStyle='#456b37';x.fillRect(0,0,W2,H2);if(RW){drawTopRoad(x,W2,H2,dpr);return;}
  let sc,ox,oy;if(TOPZ){sc=W2/42;ox=W2/2-(G.x+Math.cos(G.a)*1.3)*sc;oy=H2/2-(G.y+Math.sin(G.a)*1.3)*sc;}else{sc=Math.min(W2/152,H2/97);ox=(W2-150*sc)/2;oy=(H2-95*sc)/2;}
  x.setTransform(sc,0,0,sc,ox,oy);
  const poly=(P,col)=>{x.beginPath();x.moveTo(P[0][0],P[0][1]);for(let i=1;i<P.length;i++)x.lineTo(P[i][0],P[i][1]);x.closePath();x.fillStyle=col;x.fill();};
  for(const g of GND)poly(g.pts,g.col);for(const m of MARK)poly(m.pts,m.col);
  // 発着点・課題の名前
  x.font=`bold ${(TOPZ?13:10)*dpr/sc}px sans-serif`;x.textAlign='center';x.fillStyle='rgba(255,255,255,.85)';
  for(const [k,px,py] of [['label_S',36,38],['label_crank',112,40],['label_garage',52,68],['label_par',103.5,52.5],['label_rail',128,26],['label_start',24,77.6]])x.fillText(t(k),px,py);
  // タイヤの跡

  // ポール
  for(const p of POLES){x.beginPath();x.arc(p.x,p.y,0.22,0,7);x.fillStyle='#ff8a2a';x.fill();}
  // 信号
  for(const s of SL){if(s.type!=='signal')continue;const st=sigState(s.ph);x.beginPath();x.arc(s.cx-s.dir[0]*0.9,s.cy-s.dir[1]*0.9,0.55,0,7);x.fillStyle=st==='G'?'#3de07a':st==='Y'?'#ffd23a':'#ff4a3a';x.fill();}
  // 止まれ

  // 列車・遮断機

  if(ti.warn&&Math.floor(G.time*2)%2===0){x.fillStyle='#ff3a2a';for(const [px,py] of [[133.6,34.2],[142.4,25.8]]){x.beginPath();x.arc(px,py,0.5,0,7);x.fill();}}
  if(ti.tx!=null){x.fillStyle='#d6dde2';x.fillRect(ti.t0,28.6,ti.t1-ti.t0,2.8);x.fillStyle='#2e7bc4';x.fillRect(ti.t0,29.7,ti.t1-ti.t0,0.5);x.strokeStyle='#333';x.lineWidth=0.1;for(let i=1;i<3;i++){const bx=ti.tx+12*i;if(bx>ti.t0&&bx<ti.t1){x.beginPath();x.moveTo(bx,28.6);x.lineTo(bx,31.4);x.stroke();}}}
  // 歩行者・自転車
  const P=W.ped;x.beginPath();x.arc(P.x,P.y,0.35,0,7);x.fillStyle='#ff5ca8';x.fill();x.strokeStyle='#fff';x.lineWidth=0.08;x.stroke();
  if(W.bike.on){const B=W.bike;x.fillStyle='#2f2f2f';x.fillRect(B.x-0.15,B.y-0.85,0.3,1.7);x.beginPath();x.arc(B.x,B.y,0.3,0,7);x.fillStyle='#ffb02e';x.fill();}
  // ルートの目印
  const L=G.legs[G.leg];if(SET.route&&L){let tp=L.p;if(L.bay){const b=BAYS[L.bay];tp=[(b.x0+b.x1)/2,(b.y0+b.y1)/2];x.strokeStyle='#5dff9a';x.lineWidth=0.18;x.setLineDash([0.5,0.4]);x.strokeRect(b.x0,b.y0,b.x1-b.x0,b.y1-b.y0);x.setLineDash([]);}
    if(tp){const pu=1+0.25*Math.sin(G.time*5);x.beginPath();x.arc(tp[0],tp[1],1.1*pu,0,7);x.strokeStyle='#5dff9a';x.lineWidth=0.25;x.stroke();
      if(L.k==='stop'||L.k==='finish'){x.fillStyle='rgba(93,255,154,.35)';x.fill();}
      const cx=G.x+Math.cos(G.a)*1.3,cy=G.y+Math.sin(G.a)*1.3;const d=hyp(tp[0]-cx,tp[1]-cy);if(d>4){const ux=(tp[0]-cx)/d,uy=(tp[1]-cy)/d;const ax=cx+ux*3.4,ay=cy+uy*3.4;x.beginPath();x.moveTo(ax+ux*1.2,ay+uy*1.2);x.lineTo(ax-uy*0.7,ay+ux*0.7);x.lineTo(ax+uy*0.7,ay-ux*0.7);x.closePath();x.fillStyle='rgba(93,255,154,.9)';x.fill();}}}

function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(G&&!$('#scDrive').hidden){if(!G.over&&$('#modal').hidden){const n=2;for(let i=0;i<n;i++)tick(dt/n);}drawTop();drawCab();drawWheel();hud();lightKeys();if((frameN&7)===0)syncUI();}
  requestAnimationFrame(loop);}

function drawSign(x,id,cx,cy,s){x.save();x.translate(cx,cy);x.lineJoin='round';
  const disc=(r,fill,ring,ringW)=>{x.beginPath();x.arc(0,0,r,0,7);x.fillStyle=fill;x.fill();if(ring){x.lineWidth=ringW;x.strokeStyle=ring;x.stroke();}};
  const txt=(s2,y,size,col)=>{x.fillStyle=col;x.font=`bold ${size}px "Hiragino Sans","Noto Sans JP",sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(s2,0,y);};
  const R=s*0.42;
  if(id==='stop'||id==='jokou'){x.beginPath();x.moveTo(-R*1.1,-R*0.75);x.lineTo(R*1.1,-R*0.75);x.lineTo(0,R*1.05);x.closePath();x.fillStyle='#d7261e';x.fill();x.lineWidth=s*0.035;x.strokeStyle='#fff';x.stroke();
    txt(id==='stop'?'止まれ':'徐行',-R*0.38,s*0.17,'#fff');txt(id==='stop'?'STOP':'SLOW',-R*0.02,s*0.1,'#fff');}
  else if(id==='noentry'){disc(R,'#d7261e');x.fillStyle='#fff';x.fillRect(-R*0.72,-R*0.16,R*1.44,R*0.32);}
  else if(id==='oneway'){x.fillStyle='#2457b8';rr(x,-s*0.45,-s*0.24,s*0.9,s*0.48,s*0.04);x.fill();x.fillStyle='#fff';x.beginPath();x.moveTo(-s*0.36,-s*0.06);x.lineTo(s*0.12,-s*0.06);x.lineTo(s*0.12,-s*0.15);x.lineTo(s*0.38,0);x.lineTo(s*0.12,s*0.15);x.lineTo(s*0.12,s*0.06);x.lineTo(-s*0.36,s*0.06);x.closePath();x.fill();}
  else if(id==='nopark'||id==='nostop'){disc(R,'#2457b8','#d7261e',s*0.07);x.strokeStyle='#d7261e';x.lineWidth=s*0.07;x.beginPath();x.moveTo(-R*0.66,-R*0.66);x.lineTo(R*0.66,R*0.66);if(id==='nostop'){x.moveTo(R*0.66,-R*0.66);x.lineTo(-R*0.66,R*0.66);}x.stroke();}

  else if(id==='rail'||id==='school'){x.rotate(PI/4);x.fillStyle='#f6c51b';x.fillRect(-s*0.31,-s*0.31,s*0.62,s*0.62);x.lineWidth=s*0.025;x.strokeStyle='#111';x.strokeRect(-s*0.28,-s*0.28,s*0.56,s*0.56);x.rotate(-PI/4);x.fillStyle='#111';

 {q:o('日本では、車は道路のどちら側を走りますか？','Which side of the road do cars drive on in Japan?','Ở Nhật, ô tô đi bên nào của đường?','在日本，汽车行驶在道路的哪一侧？','Di Jepang, mobil berjalan di sisi mana?'),

  e:o('日本は左側通行。右ハンドルの車が多い。右折は交差点の中心のすぐ内側を通って小回りに、左折は道路の左端に寄って徐行。','Japan drives on the left; most cars are right-hand drive. Turn right tightly just inside the junction centre; turn left from the left edge, slowly.','Nhật đi bên trái, xe tay lái phải. Rẽ phải gọn sát tâm giao lộ, rẽ trái sát mép trái và chậm.','日本靠左行驶，多为右舵车。右转时紧贴路口中心内侧小转弯，左转时靠左侧路边慢行。','Jepang lajur kiri, setir kanan. Belok kanan rapat di sisi dalam titik tengah persimpangan; belok kiri dari tepi kiri, pelan.')},
 {q:o('赤信号のとき、左折してもよいですか？','Can you turn left on a red light?','Đèn đỏ có được rẽ trái không?','红灯时可以左转吗？','Bolehkah belok kiri saat lampu merah?'),
  c:[o('できない（青い矢印が出ているときだけ曲がれる）','No — only when a green arrow is shown','Không — chỉ khi có mũi tên xanh','不可以——只有亮绿色箭头时才可以','Tidak — hanya saat ada panah hijau'),o('安全なら左折してよい','Yes, if it is safe','Được nếu an toàn','安全的话可以','Boleh jika aman'),o('一度止まれば左折してよい','Yes, after stopping once','Được sau khi dừng lại','停一下就可以','Boleh setelah berhenti')],
  e:o('日本には「赤信号でも曲がってよい」ルールはない。青の矢印が出ている方向だけ進める。','Japan has no "turn on red" rule. You may only go in the direction of a green arrow.','Nhật không có luật "rẽ khi đèn đỏ". Chỉ đi theo mũi tên xanh.','日本没有"红灯可转弯"的规则，只能按绿色箭头方向行驶。','Jepang tidak punya aturan "belok saat merah". Hanya ikuti panah hijau.')},
 {q:o('「止まれ」の標識があるとき、正しいのは？','What must you do at a 止まれ (STOP) sign?','Gặp biển 止まれ (STOP) phải làm gì?','遇到"止まれ"（停车）标志时，正确的是？','Apa yang harus dilakukan di rambu 止まれ (STOP)?'),
  c:[o('停止線の直前で完全に止まり、左右を確かめる','Stop completely just before the line and look both ways','Dừng hẳn sát vạch, nhìn hai bên','在停止线前完全停下，确认左右','Berhenti total tepat sebelum garis, lihat kedua arah'),o('速度を落とせば止まらなくてよい','Slowing down is enough','Chỉ cần giảm tốc','减速就可以，不必停车','Cukup memperlambat'),o('他の車がいなければ止まらなくてよい','No need to stop if no other cars','Không có xe khác thì không cần dừng','没有其他车辆就不必停','Tak perlu berhenti jika sepi')],
  e:o('タイヤが完全に止まるまで止まる。止まったあと、見えにくいところは少しずつ前に出て確かめる。','Stop until the wheels stop turning, then creep forward to see if your view is blocked.','Dừng đến khi bánh xe ngừng hẳn, sau đó nhích dần để quan sát.','要停到车轮完全不动，再慢慢前移确认看不到的地方。','Berhenti sampai roda benar-benar diam, lalu maju sedikit untuk melihat.')},
 {q:o('踏切を渡るとき、正しいのは？','What is correct at a railroad crossing?','Khi qua đường ray, điều nào đúng?','通过铁路道口时，正确的是？','Apa yang benar di perlintasan kereta?'),
  c:[o('直前で一時停止し、目と耳で左右を確かめる','Stop just before it and check both ways with eyes and ears','Dừng sát trước, quan sát bằng mắt và tai','在道口前停车，用眼和耳确认左右','Berhenti tepat sebelumnya, cek dengan mata dan telinga'),o('遮断機が上がっていれば止まらずに渡る','If the barrier is up, cross without stopping','Thanh chắn đã nâng thì cứ qua','栏杆抬起就不停车直接过','Jika palang terangkat, langsung lewat'),o('早く渡るため、加速して近づく','Speed up to get across quickly','Tăng tốc để qua nhanh','加速快速通过','Percepat agar cepat lewat')],
  e:o('踏切の信号が青のときは止まらずに通れる。先が混んでいて踏切の向こうに入る余地がないときは渡らない。','At crossings with a green signal you may go without stopping. Never enter if there is no room on the other side.','Có đèn xanh tại đường ray thì được đi không cần dừng. Không vào nếu phía bên kia không còn chỗ.','道口信号灯为绿灯时可以不停车通过。对面没有空间时不要进入。','Jika ada lampu hijau di perlintasan boleh lewat tanpa berhenti. Jangan masuk jika tidak ada ruang di seberang.')},
 {q:o('標識がなく、中央線もない住宅街の道（生活道路）の最高速度は？（2026年9月から）','Max speed on a residential street with no signs and no centre line? (since Sept 2026)','Tốc độ tối đa trên đường khu dân cư không biển, không vạch giữa? (từ 9/2026)','没有标志也没有中心线的居民区道路，最高速度是？（2026年9月起）','Kecepatan maksimum di jalan permukiman tanpa rambu dan tanpa garis tengah? (sejak Sept 2026)'),
  c:[o('30km/h','30 km/h','30 km/h','30km/h','30 km/jam'),o('60km/h','60 km/h','60 km/h','60km/h','60 km/jam'),o('40km/h','40 km/h','40 km/h','40km/h','40 km/jam')],
  e:o('2026年9月1日から、中央線や中央分離帯などがない一般道路の法定速度が60km/hから30km/hになった。標識がある道は標識の速度。中央線などがある一般道路は60km/h。','From 1 Sept 2026 the legal limit on ordinary roads without a centre line or median dropped from 60 to 30 km/h. Signed limits still apply; roads with a centre line stay at 60 km/h.','Từ 1/9/2026, đường không có vạch giữa/dải phân cách giảm từ 60 xuống 30 km/h. Có biển thì theo biển; đường có vạch giữa vẫn 60 km/h.','自2026年9月1日起，没有中心线或中央分隔带的一般道路法定速度由60km/h降为30km/h。有标志按标志；有中心线的道路仍为60km/h。','Sejak 1 Sept 2026 batas jalan tanpa garis tengah/median turun dari 60 ke 30 km/jam. Jika ada rambu ikuti rambu; jalan bergaris tengah tetap 60 km/jam.')},
 {q:o('高速道路での普通乗用車の最高速度は、標識がなければ？','On expressways, the max speed for a car with no sign is?','Trên đường cao tốc, xe con không có biển thì tối đa?','高速公路上无标志时，普通轿车的最高速度是？','Di jalan tol tanpa rambu, kecepatan maks mobil?'),
  c:[o('100km/h','100 km/h','100 km/h','100km/h','100 km/jam'),o('80km/h','80 km/h','80 km/h','80km/h','80 km/jam'),o('130km/h','130 km/h','130 km/h','130km/h','130 km/jam')],
  e:o('一部の区間は標識で120km/hまで。最低速度は50km/h。','Some sections are signed up to 120 km/h. Minimum speed is 50 km/h.','Một số đoạn có biển tới 120 km/h. Tối thiểu 50 km/h.','部分路段标志限速可达120km/h，最低速度50km/h。','Beberapa ruas hingga 120 km/jam. Minimum 50 km/jam.')},
 {q:o('お酒を飲んだあとの運転について、正しいのは？','Which is correct about alcohol and driving?','Điều nào đúng về rượu bia và lái xe?','关于饮酒后驾驶，正确的是？','Mana yang benar soal alkohol dan menyetir?'),
  c:[o('少しでも飲んだら運転しない','If you drink anything, do not drive','Uống dù chỉ một chút cũng không lái','只要喝了酒就不开车','Minum sedikit pun, jangan menyetir'),o('ビール1杯なら大丈夫','One beer is fine','Một ly bia thì không sao','一杯啤酒没关系','Satu gelas bir tidak apa'),o('少し休めば必ず大丈夫','A short rest always makes it OK','Nghỉ một chút là được','稍微休息一下就肯定没问题','Istirahat sebentar pasti aman')],
  e:o('酒気帯び運転（呼気1リットル中0.15mg以上）は重い罰。お酒を出した人、車を貸した人、乗せてもらった人も罰せられることがある。','Drink-driving (0.15 mg/L breath or more) is heavily punished. People who served the alcohol, lent the car or rode along can also be punished.','Lái xe khi có cồn (≥0,15 mg/L hơi thở) bị phạt nặng. Người mời rượu, cho mượn xe, đi cùng cũng có thể bị phạt.','酒驾（呼气每升0.15mg以上）处罚很重。提供酒的人、借车的人、同乘者也可能受罚。','Mengemudi mabuk (≥0,15 mg/L napas) dihukum berat. Pemberi minuman, peminjam mobil, dan penumpang juga bisa dihukum.')},
 {q:o('シートベルトをしめるのは？','Who must wear a seat belt?','Ai phải thắt dây an toàn?','谁必须系安全带？','Siapa yang wajib memakai sabuk pengaman?'),
  c:[o('全員（後ろの席も）。6歳未満はチャイルドシート','Everyone, including rear seats. Child seat under age 6','Tất cả kể cả ghế sau. Dưới 6 tuổi dùng ghế trẻ em','所有人（包括后排）。6岁以下用儿童座椅','Semua termasuk kursi belakang. Di bawah 6 tahun pakai kursi anak'),o('運転席と助手席だけ','Only driver and front passenger','Chỉ ghế lái và ghế phụ','只有驾驶座和副驾驶','Hanya pengemudi dan depan'),o('高速道路を走るときだけ','Only on expressways','Chỉ trên cao tốc','只在高速公路上','Hanya di jalan tol')],
  e:o('運転者は同乗者にもシートベルトをさせる義務がある。','The driver must make sure passengers wear belts too.','Người lái phải bảo đảm hành khách thắt dây.','驾驶员有义务让同乘者也系好安全带。','Pengemudi wajib memastikan penumpang memakai sabuk.')},
 {q:o('運転中、スマートフォンを手に持って通話・画面を見るのは？','Holding a phone to talk or look at the screen while driving is…','Cầm điện thoại nói chuyện / xem màn hình khi lái là…','驾驶时手持手机通话或看屏幕是……','Memegang ponsel untuk bicara/melihat layar saat menyetir adalah…'),
  c:[o('違反。使うときは安全な場所に止めてから','An offence — stop somewhere safe first','Vi phạm — dừng nơi an toàn rồi mới dùng','违法。要先停在安全的地方再用','Pelanggaran — berhenti di tempat aman dulu'),o('短い時間なら問題ない','Fine if it is short','Ngắn thì không sao','时间短就没问题','Tidak apa jika sebentar'),o('ゆっくり走っていれば問題ない','Fine if driving slowly','Đi chậm thì không sao','开得慢就没问题','Tidak apa jika pelan')],
  e:o('事故を起こしたときなどは、さらに重い罰になる。','Penalties are heavier if it causes danger or an accident.','Gây nguy hiểm hoặc tai nạn thì bị phạt nặng hơn.','造成危险或事故时处罚更重。','Hukuman lebih berat jika menimbulkan bahaya/kecelakaan.')},
 {q:o('横断歩道を渡ろうとしている人がいます。どうしますか？','Someone is about to use a pedestrian crossing. What do you do?','Có người sắp qua vạch sang đường. Bạn làm gì?','有人准备通过人行横道，你怎么做？','Ada orang akan menyeberang di zebra cross. Apa yang dilakukan?'),
  c:[o('手前で一時停止して、先に渡らせる','Stop before the crossing and let them cross','Dừng trước vạch, để họ đi trước','在前面停车，让对方先过','Berhenti sebelum zebra cross, biarkan menyeberang'),o('クラクションで知らせて通る','Honk and go','Bấm còi rồi đi','按喇叭提醒后通过','Bunyikan klakson lalu jalan'),o('速度を落とさず先に通る','Go first without slowing','Không giảm tốc, đi trước','不减速先通过','Jalan duluan tanpa melambat')],
  e:o('横断歩道では歩行者が優先。人がいるかどうか分からないときも、止まれる速さで近づく。','Pedestrians have priority at crossings. If unsure whether anyone is there, approach slowly enough to stop.','Người đi bộ được ưu tiên. Không chắc có người hay không thì cũng tiến tới đủ chậm để dừng.','人行横道行人优先。不确定有没有人时，也要以能停下的速度接近。','Pejalan kaki prioritas. Jika ragu, dekati dengan kecepatan yang bisa berhenti.')},
 {q:o('交差点で右折しようとしたら、対向から直進車が来ました。','You are turning right and an oncoming car is going straight.','Bạn rẽ phải, xe đối diện đi thẳng tới.','你要右转，对面有直行车开来。','Anda belok kanan dan mobil dari depan lurus.'),
  c:[o('直進車が先。通り過ぎるまで待つ','The straight-going car goes first — wait','Xe đi thẳng được đi trước — chờ','直行车优先，等它通过','Mobil lurus duluan — tunggu'),o('先に曲がってよい','You may turn first','Bạn được rẽ trước','可以先转弯','Anda boleh belok duluan'),o('ライトを点滅させて先に曲がる','Flash your lights and turn first','Nháy đèn rồi rẽ trước','闪灯后先转','Kedipkan lampu lalu belok')],
  e:o('右折車は、直進車や左折車の進行を妨げてはいけない。','A right-turning car must not obstruct straight-going or left-turning traffic.','Xe rẽ phải không được cản trở xe đi thẳng hoặc rẽ trái.','右转车不得妨碍直行车和左转车。','Mobil belok kanan tidak boleh menghalangi yang lurus/belok kiri.')},
 {q:o('救急車がサイレンを鳴らして近づいてきました。交差点の近くではどうしますか？','An ambulance with its siren on approaches. Near a junction you should…','Xe cứu thương hú còi đến gần. Gần giao lộ bạn nên…','救护车鸣笛驶近。在路口附近应该……','Ambulans bersirene mendekat. Di dekat persimpangan Anda harus…'),
  c:[o('交差点を避け、道路の左に寄って一時停止','Clear the junction, pull to the left and stop','Tránh khỏi giao lộ, tấp vào bên trái và dừng','避开路口，靠道路左侧停车','Keluar dari persimpangan, menepi ke kiri dan berhenti'),o('その場で急停止','Brake hard where you are','Phanh gấp tại chỗ','原地急刹车','Rem mendadak di tempat'),o('加速して先に行く','Speed up and go ahead','Tăng tốc chạy trước','加速先走','Percepat dan jalan duluan')],
  e:o('交差点以外では、道路の左に寄って進路を譲る。','Away from junctions, keep left and give way.','Ngoài giao lộ, đi sát trái để nhường đường.','不在路口时，靠左让路。','Di luar persimpangan, menepi ke kiri dan beri jalan.')},
 {q:o('自転車の右側を通るとき（2026年4月から）、正しいのは？','Passing a cyclist on its right (since April 2026), which is correct?','Khi vượt bên phải xe đạp (từ 4/2026), điều nào đúng?','从自行车右侧通过时（2026年4月起），正确的是？','Melewati sepeda di sisi kanannya (sejak April 2026), mana yang benar?'),
  c:[o('十分な間隔（目安1m）をあけるか、間隔に合った安全な速度で','Leave enough space (about 1 m) or go at a speed safe for the gap','Giữ khoảng cách đủ (~1 m) hoặc đi tốc độ an toàn','保持足够间隔（约1米），或以与间隔相符的安全速度通过','Beri jarak cukup (±1 m) atau pelan sesuai jaraknya'),o('クラクションで左に寄せてから通る','Honk to make it move left, then pass','Bấm còi bắt xe đạp tránh sang trái','按喇叭让其靠左再通过','Klakson agar sepeda minggir'),o('間隔は気にしなくてよい','The gap does not matter','Không cần quan tâm khoảng cách','不用在意间隔','Jarak tidak penting')],
  e:o('2026年4月1日施行。間隔が十分でないときの速度の目安は時速20〜30km程度。自転車もできるだけ左端に寄る。','In force since 1 April 2026. Without enough space, about 20–30 km/h is a guide. Cyclists must keep as far left as possible.','Có hiệu lực từ 1/4/2026. Khi không đủ khoảng cách, tham khảo 20–30 km/h. Xe đạp phải đi sát lề trái.','2026年4月1日施行。间隔不够时速度参考约20～30km/h。自行车也要尽量靠左。','Berlaku 1 April 2026. Jika jarak kurang, acuan sekitar 20–30 km/jam. Sepeda harus sekiri mungkin.')},
 {q:o('黄色の信号の意味は？','What does a yellow (amber) light mean?','Đèn vàng có nghĩa là gì?','黄灯的意思是？','Apa arti lampu kuning?'),
  c:[o('停止位置で安全に止まれないとき以外は止まる','Stop, unless you cannot stop safely at the stop position','Dừng lại, trừ khi không thể dừng an toàn','除非无法在停止位置安全停车，否则要停','Berhenti, kecuali tidak bisa berhenti dengan aman'),o('急いで通る合図','Hurry through','Tín hiệu đi nhanh qua','赶快通过的信号','Tanda untuk buru-buru lewat'),o('注意すれば進んでよい','Go if careful','Cẩn thận thì được đi','注意的话可以前进','Boleh jalan jika hati-hati')],
  e:o('黄色の点滅は「他の交通に注意して進める」、赤の点滅は「一時停止して安全を確かめる」。','Flashing yellow: proceed with care. Flashing red: stop, then proceed when safe.','Vàng nhấp nháy: đi cẩn thận. Đỏ nhấp nháy: dừng rồi đi khi an toàn.','黄灯闪烁：注意其他交通后可通行；红灯闪烁：停车确认安全。','Kuning berkedip: jalan hati-hati. Merah berkedip: berhenti dulu.')},
 {q:o('外国の免許で日本を運転するには？','How can you drive in Japan with a foreign licence?','Muốn lái ở Nhật bằng bằng lái nước ngoài thì?','持外国驾照如何在日本驾驶？','Bagaimana mengemudi di Jepang dengan SIM asing?'),
  c:[o('1949年ジュネーブ条約の国際運転免許証（日本に来て1年以内）など、決められた免許が必要','You need a permitted licence, e.g. an International Driving Permit under the 1949 Geneva Convention (within 1 year of arrival)','Cần giấy phép hợp lệ, ví dụ bằng lái quốc tế theo Công ước Geneva 1949 (trong 1 năm từ khi đến)','需要规定的驾照，例如1949年日内瓦公约的国际驾照（入境1年内）','Perlu izin yang sah, mis. SIM Internasional Konvensi Jenewa 1949 (dalam 1 tahun sejak tiba)'),o('自分の国の免許だけでよい','Your home licence alone is enough','Chỉ cần bằng lái nước mình','只用本国驾照就可以','Cukup SIM negara sendiri'),o('レンタカーなら免許はいらない','No licence needed for rental cars','Thuê xe thì không cần bằng','租车不需要驾照','Mobil sewa tidak perlu SIM')],

// 危険予測の絵
function drawScene(x,sc,W2,H2,reveal){x.save();x.fillStyle=sc.night?'#141a22':'#5f8f4a';x.fillRect(0,0,W2,H2);const rw=W2*0.36,cx=W2/2;
  const road=sc.night?'#2a2e33':'#6a6f73';x.fillStyle=road;x.fillRect(cx-rw/2,0,rw,H2);
  if(sc.road==='x'){x.fillRect(0,H2*0.4,W2,H2*0.22);}
  if(sc.road==='r'){x.fillStyle='#6e6152';x.fillRect(0,H2*0.45,W2,H2*0.1);x.fillStyle='#bbb';x.fillRect(0,H2*0.47,W2,3);x.fillRect(0,H2*0.52,W2,3);x.fillStyle='#ffd23a';x.fillRect(cx-rw/2-28,H2*0.58,28,6);x.fillRect(cx+rw/2,H2*0.4,28,6);}
  x.strokeStyle=sc.night?'#777':'#eee';x.setLineDash(sc.road==='n'?[]:[12,10]);x.lineWidth=2;if(sc.road!=='n'){x.beginPath();x.moveTo(cx,0);x.lineTo(cx,H2);x.stroke();}x.setLineDash([]);
  if(sc.light){x.fillStyle='#222';x.fillRect(cx-rw/2-34,H2*0.3,30,12);x.fillStyle='#2ad06a';x.beginPath();x.arc(cx-rw/2-28,H2*0.3+6,4,0,7);x.fill();}
  const put=(it,hl)=>{const [k,u,v,a]=it;const px=u*W2,py=v*H2;x.save();x.translate(px,py);
    if(k==='car'||k==='bus'){x.rotate(a||-PI/2);const L=k==='bus'?W2*0.16:W2*0.1,Wd=k==='bus'?W2*0.055:W2*0.05;x.fillStyle=k==='bus'?'#e6a23c':'#c8ced3';rr(x,-L/2,-Wd/2,L,Wd,4);x.fill();x.fillStyle='rgba(30,40,55,.8)';x.fillRect(L*0.12,-Wd*0.38,L*0.16,Wd*0.76);}
    else if(k==='ped'||k==='child'){const r=k==='child'?5:6;x.fillStyle=sc.night?'#3a3a48':'#d6457f';x.beginPath();x.arc(0,0,r,0,7);x.fill();x.fillStyle='#f0c8a0';x.beginPath();x.arc(0,0,r*0.5,0,7);x.fill();}
    else if(k==='bike'||k==='moto'){x.rotate(a||0);x.fillStyle=k==='moto'?'#c0392b':'#333';x.fillRect(-12,-3,24,6);x.fillStyle='#ffb02e';x.beginPath();x.arc(0,0,4,0,7);x.fill();}
    else if(k==='ball'){x.fillStyle='#ff7a1a';x.beginPath();x.arc(0,0,4,0,7);x.fill();}
    else if(k==='door'){x.fillStyle='#c8ced3';x.fillRect(0,-2,14,4);}
    else if(k==='zebra'){x.fillStyle='#eee';for(let i=0;i<6;i++)x.fillRect(-rw/2+6+i*rw/6.3,-8,rw/12,16);}
    else if(k==='arrowL'||k==='arrowR'){x.strokeStyle='rgba(93,255,154,.9)';x.lineWidth=4;x.beginPath();x.moveTo(0,30);x.lineTo(0,0);x.quadraticCurveTo(0,-14,k==='arrowL'?-26:26,-14);x.stroke();}
    if(hl){x.strokeStyle='#ff3b30';x.lineWidth=3;x.beginPath();x.arc(0,0,18,0,7);x.stroke();}
    x.restore();};
  sc.objs.forEach(it=>put(it,false));if(reveal)sc.hide.forEach(it=>put(it,true));
  // 自分の車（下から上へ・左側通行）
  x.save();x.translate(cx-rw/4,H2*0.86);x.fillStyle='#2f7fe0';rr(x,-W2*0.025,-W2*0.05,W2*0.05,W2*0.1,4);x.fill();x.fillStyle='rgba(20,30,45,.8)';x.fillRect(-W2*0.019,-W2*0.03,W2*0.038,W2*0.02);
  if(sc.night){x.fillStyle='rgba(255,240,170,.18)';x.beginPath();x.moveTo(-10,-W2*0.05);x.lineTo(-60,-H2*0.7);x.lineTo(60,-H2*0.7);x.lineTo(10,-W2*0.05);x.fill();}x.restore();
  x.restore();}

/* ================= クイズの進行 ================= */
let QZ=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function startQuiz(kind,opts){opts=opts||{};const src=kind==='sign'?QS:kind==='rule'?QR:kind==='haz'?QH:QS.concat(QR);const n=opts.n||10;QZ={kind,opts,list:shuffle(src).slice(0,Math.min(n,src.length)),i:0,ok:0};$('#quizT').textContent=opts.school?t(opts.school):t(kind==='sign'?'quizSign':kind==='rule'?'quizRule':'quizHaz');show('scQuiz');renderQ();}
function renderQ(){const B=$('#quizB');const q=QZ.list[QZ.i];if(!q&&QZ.opts&&QZ.opts.school){const O=QZ.opts,pass=QZ.ok>=O.need;if(pass)schStamp(O.school,{score:QZ.ok+'/'+QZ.list.length});
    B.innerHTML=`<div class="qq">${t('result',QZ.list.length,QZ.ok)}</div>`;
    schModal(pass,pass?(O.school==='kari'?'i_kariPass':'i_quizPass'):'i_quizFail',`<div class="big">${QZ.ok} / ${QZ.list.length}</div>${pass&&O.school==='kari'?certHTML():''}`);return;}
  if(!q){B.innerHTML=`<div class="qq">${t('result',QZ.list.length,QZ.ok)}</div><div class="big" style="font-size:42px;font-family:var(--num)">${Math.round(QZ.ok/QZ.list.length*100)}%</div><div class="btns" style="display:flex;gap:8px"><button class="btn pri" id="qAgain">${t('again')}</button><button class="btn" id="qMenu">${t('toMenu')}</button></div>`;$('#qAgain').onclick=()=>startQuiz(QZ.kind);$('#qMenu').onclick=()=>goBack();return;}
  const typ=q.sign?'sign':q.sc?'haz':'rule';const ch=shuffle(q.c.map((c,i)=>({c,ok:i===0})));const qtext=typ==='sign'?t('signQ'):typ==='haz'?t('hazQ'):tq(q.q);
  B.innerHTML=`<div class="qmeta"><span>${t('qn',QZ.i+1,QZ.list.length)}</span><span>✓ ${QZ.ok}</span></div>${typ!=='rule'?`<div class="qfig${typ==='haz'?' dark':''}"><canvas id="qCv" width="${typ==='haz'?720:360}" height="${typ==='haz'?480:300}"></canvas></div>`:''}<div class="qq">${qtext}</div><div class="choices">${ch.map((c,i)=>`<button data-k="${i}">${tq(c.c)}</button>`).join('')}</div><div id="qFb"></div>`;
  const draw=(rev)=>{const cv=$('#qCv');if(!cv)return;const x=cv.getContext('2d');if(typ==='sign'){x.clearRect(0,0,cv.width,cv.height);drawSign(x,q.sign,cv.width/2,cv.height/2,cv.height*0.9);}else drawScene(x,q.sc,cv.width,cv.height,rev);};draw(false);
  $$('#quizB .choices button').forEach(b=>b.onclick=()=>{if(b.parentNode.dataset.done)return;b.parentNode.dataset.done=1;const k=+b.dataset.k,ok=ch[k].ok;if(ok)QZ.ok++;sfx(ok?'ok':'pen');
    $$('#quizB .choices button').forEach((bb,i)=>{if(ch[i].ok)bb.classList.add('ok');else if(i===k)bb.classList.add('ng');});
    if(typ==='haz')draw(true);
    const ex=typ==='haz'?(q.sc.hide.length?`<div class="muted">🔴 ${t('hidden')}</div>`:'')+tq(q.c[0]):tq(q.e);
    $('#qFb').innerHTML=`<div class="fb${ok?'':' ng'}"><b>${t(ok?'correct':'wrong')}</b>${ex}</div><div style="margin-top:8px"><button class="btn pri" id="qNext">${t('nextQ')}</button></div>`;
    $('#qNext').onclick=()=>{QZ.i++;renderQ();};});}

/* ================= ルールブック ================= */
let BOOKTAB='rule';
function renderBook(){const B=$('#bookB');$('#tbRule').setAttribute('aria-pressed',BOOKTAB==='rule');$('#tbSign').setAttribute('aria-pressed',BOOKTAB==='sign');
  if(BOOKTAB==='rule'){B.innerHTML=QR.map(q=>`<div class="bk"><b>${tq(q.q)}</b><p>✅ ${tq(q.c[0])}</p><p class="muted">${tq(q.e)}</p></div>`).join('');}
  else{B.innerHTML=QS.map((q,i)=>`<div class="bk"><canvas width="168" height="168" data-s="${i}"></canvas><b>${tq(q.c[0])}</b><p class="muted">${tq(q.e)}</p></div>`).join('');
    $$('#bookB canvas').forEach(cv=>{const q=QS[+cv.dataset.s];drawSign(cv.getContext('2d'),q.sign,84,84,150);});}}
$('#tbRule').onclick=()=>{BOOKTAB='rule';renderBook();};$('#tbSign').onclick=()=>{BOOKTAB='sign';renderBook();};

/* ================= 公道モード（OpenStreetMap の道路データ） ================= */
let RW=null;        // 走行中の道路データ（公道モードのときだけ）
let AREA=null;      // 読み込んだエリア（コース作りで使う）
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
const SAGA_BB=[32.95,129.70,33.62,130.56];
async function overpass(q){let err;for(const u of OVERPASS){try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),70000);
  const r=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctl.signal});clearTimeout(tm);
  if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}catch(e){err=e;}}throw err||new Error('overpass');}
function areaQuery(s,w,n,e){const bb=`(${s.toFixed(6)},${w.toFixed(6)},${n.toFixed(6)},${e.toFixed(6)})`;
  return `[out:json][timeout:90];(way["highway"~"^(trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|trunk_link|primary_link|secondary_link|tertiary_link)$"]${bb};node["highway"~"^(traffic_signals|stop|crossing)$"]${bb};node["railway"="level_crossing"]${bb};way["railway"~"^(rail|light_rail)$"]${bb};);out body geom;way["building"]${bb};out geom 2500;`;}
function bboxAround(lat,lon,half){const dLat=half/110540,dLon=half/(111320*Math.cos(lat*PI/180));return [lat-dLat,lon-dLon,lat+dLat,lon+dLon];}
async function loadArea(lat,lon,label,half){half=half||1000;const [s,w,n,e]=bboxAround(lat,lon,half);const osm=await overpass(areaQuery(s,w,n,e));return buildRoadWorld(osm,{lat,lon},label,half);}

/* ---------- 道路データを組み立てる ---------- */
const HW_W={trunk:10,primary:9,secondary:7.5,tertiary:6.5,unclassified:5,residential:5,living_street:4,service:3.6,trunk_link:4.5,primary_link:4.5,secondary_link:4.5,tertiary_link:4.5};
const HW_COST={service:3,residential:1.35,living_street:1.8,unclassified:1.15};
const GC=25;  // 判定用の升目（m）
const gkey=(gx,gy)=>gx*100003+gy;
function gridAdd(G,x0,y0,x1,y1,v,cs){cs=cs||GC;for(let gx=Math.floor(x0/cs);gx<=Math.floor(x1/cs);gx++)for(let gy=Math.floor(y0/cs);gy<=Math.floor(y1/cs);gy++){const k=gkey(gx,gy);let a=G.get(k);if(!a)G.set(k,a=[]);a.push(v);}}
function gridNear(G,x,y,r,cs){cs=cs||GC;const out=new Set();for(let gx=Math.floor((x-r)/cs);gx<=Math.floor((x+r)/cs);gx++)for(let gy=Math.floor((y-r)/cs);gy<=Math.floor((y+r)/cs);gy++){const a=G.get(gkey(gx,gy));if(a)for(const v of a)out.add(v);}return out;}
function segDist(px,py,s){const t=clamp(((px-s.ax)*s.dx+(py-s.ay)*s.dy),0,s.L);const qx=s.ax+s.dx*t,qy=s.ay+s.dy*t;return [hyp(px-qx,py-qy),t];}
function buildRoadWorld(osm,center,label,half){
  const lat0=center.lat,lon0=center.lon,kx=111320*Math.cos(lat0*PI/180),ky=110540;
  const P=(lat,lon)=>[(lon-lon0)*kx,-(lat-lat0)*ky];
  const R={center,label,half:half||1000,kx,ky,nodes:new Map(),ways:[],segs:[],sg:new Map(),rg:new Map(),mg:new Map(),bg:new Map(),
    sig:[],stops:[],lx:[],cross:[],rails:[],blds:[],adj:new Map(),junc:[],jg:new Map(),schools:[]};
  R.toXY=P;R.toLL=(x,y)=>({lat:lat0-y/ky,lon:lon0+x/kx});
  const tagged=new Map();
  for(const el of osm.elements||[]){if(el.type==='node'&&el.tags)tagged.set(el.id,el);}
  const nidWays=new Map();
  for(const el of osm.elements||[]){if(el.type!=='way'||!el.geometry)continue;const tg=el.tags||{};
    const pts=el.geometry.map(g=>P(g.lat,g.lon));
    if(tg.highway){
      if(tg.area==='yes'||tg.access==='private'||tg.access==='no'||['parking_aisle','drive-through','emergency_access'].includes(tg.service))continue;
      const hw=tg.highway;let lanes=parseInt(tg.lanes)||0;let ow=(tg.oneway==='yes'||tg.oneway==='1'||tg.oneway==='true'||tg.junction==='roundabout')?1:tg.oneway==='-1'?-1:0;
      let w=HW_W[hw]||5;if(lanes)w=Math.max(3.2,lanes*3.1);const tw=parseFloat(tg.width);if(tw>=3&&tw<=25)w=tw;
      const two=!ow&&w>=6&&(lanes>=2||(!lanes&&['trunk','primary','secondary','tertiary'].includes(hw)));
      let lim=parseInt(tg.maxspeed);if(!(lim>=10&&lim<=120))lim=two||(ow&&lanes>=2)||['trunk','primary'].includes(hw)?60:30;
      const wi=R.ways.length;const W2={id:el.id,hw,w,hw2:w/2,ow,two,lim,pts,nids:el.nodes||[],name:tg.name||'',cost:HW_COST[hw]||1};R.ways.push(W2);
      W2.nids.forEach((nid,i)=>{const p=pts[i];if(!p)return;let n=R.nodes.get(nid);if(!n){n={id:nid,x:p[0],y:p[1],e:0,ways:new Set()};R.nodes.set(nid,n);}n.ways.add(wi);
        n.e+=(i>0?1:0)+(i<W2.nids.length-1?1:0);let a=nidWays.get(nid);if(!a)nidWays.set(nid,a=[]);a.push([wi,i]);});
      for(let i=0;i<pts.length-1;i++){const [ax,ay]=pts[i],[bx,by]=pts[i+1];const L=hyp(bx-ax,by-ay);if(L<0.05)continue;
        const s={ax,ay,bx,by,dx:(bx-ax)/L,dy:(by-ay)/L,L,w,hw:w/2,two,ow,lim,wi};const si=R.segs.length;R.segs.push(s);
        gridAdd(R.sg,Math.min(ax,bx)-s.hw-1,Math.min(ay,by)-s.hw-1,Math.max(ax,bx)+s.hw+1,Math.max(ay,by)+s.hw+1,si);
        const a=W2.nids[i],b=W2.nids[i+1];const c=L*W2.cost;
        if(ow!==-1){let A=R.adj.get(a);if(!A)R.adj.set(a,A=[]);A.push({to:b,len:L,c,hw:w/2,ow,lim});}
        if(ow!==1){let B=R.adj.get(b);if(!B)R.adj.set(b,B=[]);B.push({to:a,len:L,c,hw:w/2,ow,lim});}}}
    else if(tg.railway){R.rails.push(pts);}
    else if(tg.building){const pp=pts.slice(0,-1);if(pp.length<3)continue;let h=parseFloat(tg.height);if(!(h>2&&h<200))h=(parseInt(tg['building:levels'])||(tg.building==='apartments'?4:2))*3.1;
      let cx=0,cy=0;pp.forEach(p=>{cx+=p[0];cy+=p[1];});cx/=pp.length;cy/=pp.length;const bi=R.blds.length;R.blds.push({pts:pp,h,cx,cy,col:['#cfc6b8','#b9c2c9','#d8cdb7','#c4b6a3','#aab3ba'][Math.abs(el.id)%5]});
      gridAdd(R.bg,cx,cy,cx,cy,bi,50);}}
  if(!R.segs.length)throw new Error('no roads');
  // 交差点
  for(const n of R.nodes.values()){if(n.e>=3){R.junc.push(n);gridAdd(R.jg,n.x,n.y,n.x,n.y,n,50);}}
  // 交差点の角の丸み（隅切り）：交差点に円を足す
  R.discs=[];R.dg=new Map();for(const n of R.junc){let mh=0;for(const wi of n.ways)mh=Math.max(mh,R.ways[wi].hw2);const r=Math.min(mh+3.2,10);const poly=[];for(let k=0;k<14;k++){const a2=k/14*2*PI;poly.push([n.x+Math.cos(a2)*r,n.y+Math.sin(a2)*r]);}
    const D={x:n.x,y:n.y,r,ax:n.x,ay:n.y,bx:n.x,by:n.y,L:0,w:2*r,quad:poly};R.discs.push(D);gridAdd(R.dg,n.x-r,n.y-r,n.x+r,n.y+r,D);}
  const nearJunc=(x,y,r)=>{let best=null,bd=r;for(const n of gridNear(R.jg,x,y,r,50)){const d=hyp(n.x-x,n.y-y);if(d<bd){bd=d;best=n;}}return best;};
  R.nearJunc=nearJunc;
  const wayAt=(nid)=>nidWays.get(nid)||[];
  // 信号（近いものをまとめて1つの交差点に）
  const sigN=[...tagged.values()].filter(n=>n.tags.highway==='traffic_signals').map(n=>P(n.lat,n.lon));
  const used=new Array(sigN.length).fill(false);
  for(let i=0;i<sigN.length;i++){if(used[i])continue;const grp=[sigN[i]];used[i]=true;for(let j=i+1;j<sigN.length;j++){if(!used[j]&&hyp(sigN[j][0]-sigN[i][0],sigN[j][1]-sigN[i][1])<35){used[j]=true;grp.push(sigN[j]);}}
    let cx=0,cy=0;grp.forEach(p=>{cx+=p[0];cy+=p[1];});cx/=grp.length;cy/=grp.length;const j=nearJunc(cx,cy,28);if(j){cx=j.x;cy=j.y;}
    // 一番広い道の向きを軸に
    let bw=0,ax=0;for(const si of gridNear(R.sg,cx,cy,15)){const s=R.segs[si];if(segDist(cx,cy,s)[0]<12&&s.w>bw){bw=s.w;ax=Math.atan2(s.dy,s.dx);}}
    const r=clamp(bw/2+5,8,15);R.sig.push({x:cx,y:cy,r,axis:ax,off:(R.sig.length*11)%30});}
  // 一時停止・踏切・横断歩道
  for(const n of tagged.values()){const tg=n.tags;const [x,y]=P(n.lat,n.lon);const occ=wayAt(n.id);if(!occ.length)continue;const [wi,idx]=occ[0];const W2=R.ways[wi];
    const nb=W2.pts[idx+1]||W2.pts[idx-1];const sgn=W2.pts[idx+1]?1:-1;let dx=(nb[0]-x)*sgn,dy=(nb[1]-y)*sgn;const L=hyp(dx,dy)||1;dx/=L;dy/=L;
    if(tg.highway==='stop'){let dir=0;if(tg.direction==='forward')dir=1;else if(tg.direction==='backward')dir=-1;
      else{const walk=s=>{let d=0;for(let k=idx;k>=0&&k<W2.nids.length-1+(s<0?1:0);k+=s){const a=W2.pts[k],b=W2.pts[k+s];if(!b)break;d+=hyp(b[0]-a[0],b[1]-a[1]);const nn=R.nodes.get(W2.nids[k+s]);if(nn&&nn.e>=3)return d;if(d>45)break;}return 1e9;};
        dir=walk(1)<=walk(-1)?1:-1;}
      R.stops.push({x,y,dx:dx*dir,dy:dy*dir,hw:W2.hw2,two:W2.two});}
    else if(tg.railway==='level_crossing'){R.lx.push({x,y,dx,dy,hw:W2.hw2});}
    else if(tg.highway==='crossing'&&!((R.nodes.get(n.id)||{}).e>=3)){R.cross.push({x,y,dx,dy,hw:W2.hw2});}}
  for(const n of tagged.values())if(n.tags.amenity==='driving_school'){const [x,y]=P(n.lat,n.lon);R.schools.push({x,y,name:n.tags.name||''});}
  // 地面（道路の四角形）と白線などを升目に
  for(const D of R.discs)gridAdd(R.rg,D.x,D.y,D.x,D.y,D,50);
  for(const s of R.segs){const h=s.hw+0.8,ex=s.dx*h,ey=s.dy*h,nx=-s.dy*h,ny=s.dx*h;const A=[s.ax-ex,s.ay-ey],B=[s.bx+ex,s.by+ey];
    s.quad=[[A[0]+nx,A[1]+ny],[B[0]+nx,B[1]+ny],[B[0]-nx,B[1]-ny],[A[0]-nx,A[1]-ny]];gridAdd(R.rg,(s.ax+s.bx)/2,(s.ay+s.by)/2,(s.ax+s.bx)/2,(s.ay+s.by)/2,s,50);}
  const mark=(pts,col)=>{let cx=0,cy=0;pts.forEach(p=>{cx+=p[0];cy+=p[1];});cx/=pts.length;cy/=pts.length;gridAdd(R.mg,cx,cy,cx,cy,{pts,col},50);};
  for(const s of R.segs){if(!s.two)continue;for(let d=1;d<s.L-1;d+=6){const x=s.ax+s.dx*d,y=s.ay+s.dy*d,e=Math.min(s.L,d+3);const x2=s.ax+s.dx*e,y2=s.ay+s.dy*e;
    if(nearJunc(x,y,s.hw+5)||nearJunc(x2,y2,s.hw+5))continue;mark(quadAlong(x,y,x2,y2,0.08),'#ece9df');}}
  // 信号の停止線：交差点の円に入る道の左側の車線に
  for(const S2 of R.sig){S2.lines=[];for(const si of gridNear(R.sg,S2.x,S2.y,S2.r+30)){const s=R.segs[si];const da=hyp(s.ax-S2.x,s.ay-S2.y),db=hyp(s.bx-S2.x,s.by-S2.y);
      if((da<S2.r)===(db<S2.r))continue;let ix,iy,ox,oy;const inA=da<S2.r;const t0=inA?0:s.L,step=inA?1:-1;
      for(let k=0;k<=s.L;k+=0.5){const tt=inA?k:s.L-k;const x=s.ax+s.dx*tt,y=s.ay+s.dy*tt;if(hyp(x-S2.x,y-S2.y)>=S2.r){ix=x;iy=y;break;}}
      if(ix==null)continue;ox=inA?s.dx:-s.dx;oy=inA?s.dy:-s.dy;  // 交差点から外向き
      const vx=-ox,vy=-oy;const lx=vy,ly=-vx;  // 入ってくる車の左
      const wdt=s.ow?s.w:s.hw;const ax2=ix+(s.ow?-lx*s.hw:0),ay2=iy+(s.ow?-ly*s.hw:0);const bx2=ax2+lx*wdt,by2=ay2+ly*wdt;
      mark([[ax2-ox*0.22,ay2-oy*0.22],[bx2-ox*0.22,by2-oy*0.22],[bx2+ox*0.22,by2+oy*0.22],[ax2+ox*0.22,ay2+oy*0.22]],'#f2f2ea');S2.lines.push({x:ix,y:iy,ox,oy,lx,ly,hw:s.hw});}}
  // 一時停止の停止線
  for(const s of R.stops){const lx=s.dy,ly=-s.dx;const wdt=s.two||s.hw<2.6?s.hw:s.hw;const a=[s.x,s.y],b=[s.x+lx*wdt,s.y+ly*wdt];
    mark([[a[0]-s.dx*0.25,a[1]-s.dy*0.25],[b[0]-s.dx*0.25,b[1]-s.dy*0.25],[b[0]+s.dx*0.25,b[1]+s.dy*0.25],[a[0]+s.dx*0.25,a[1]+s.dy*0.25]],'#f2f2ea');}
  // 横断歩道
  for(const c of R.cross){const nx=-c.dy,ny=c.dx;for(let o=-c.hw+0.3;o<c.hw-0.2;o+=0.9){const cx=c.x+nx*(o+0.22),cy=c.y+ny*(o+0.22);mark(quadAlong(cx-c.dx*2,cy-c.dy*2,cx+c.dx*2,cy+c.dy*2,0.22),'#f2f2ea');}}
  // 線路（地面）
  R.railQ=[];for(const L of R.rails)for(let i=0;i<L.length-1;i++){const [ax,ay]=L[i],[bx,by]=L[i+1];R.railQ.push({q:quadAlong(ax,ay,bx,by,1.7),r1:quadAlong(ax,ay,bx,by,0.75),cx:(ax+bx)/2,cy:(ay+by)/2});}
  for(const q of R.railQ)gridAdd(R.mg,q.cx,q.cy,q.cx,q.cy,{pts:q.q,col:'#6e6152',rail:q},50);
  // 全体の地図（キャッシュ）
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const s of R.segs){x0=Math.min(x0,s.ax,s.bx);y0=Math.min(y0,s.ay,s.by);x1=Math.max(x1,s.ax,s.bx);y1=Math.max(y1,s.ay,s.by);}R.bounds=[x0,y0,x1,y1];
  return R;}
const SH=0.8; // 路肩（白線の外側）も走れる範囲に含める
function roadSegAt(R,x,y){let best=null,bd=1e9,bt=0;for(const si of gridNear(R.sg,x,y,0.1)){const s=R.segs[si];const [d,t2]=segDist(x,y,s);if(d<=s.hw+SH+0.05&&d<bd){bd=d;best=s;bt=t2;}}return best?{s:best,d:bd,t:bt}:null;}
function roadInDrv(x,y){if(roadSegAt(RW,x,y))return true;for(const D of gridNear(RW.dg,x,y,0.1))if(hyp(x-D.x,y-D.y)<=D.r)return true;return false;}

/* ---------- 道順（ダイクストラ） ---------- */
function nearestNode(R,x,y,maxd){let best=null,bd=maxd||1e9;for(const si of gridNear(R.sg,x,y,Math.min(maxd||200,200))){const s=R.segs[si];const W2=R.ways[s.wi];
  for(const nid of W2.nids){const n=R.nodes.get(nid);if(!n||!R.adj.get(nid))continue;const d=hyp(n.x-x,n.y-y);if(d<bd){bd=d;best=n;}}}
  if(!best&&maxd==null){for(const n of R.nodes.values()){if(!R.adj.get(n.id))continue;const d=hyp(n.x-x,n.y-y);if(d<bd){bd=d;best=n;}}}return best;}
function dijkstra(R,from,to,ban){if(from===to)return [from];const dist=new Map([[from,0]]),prev=new Map(),H=[[0,from]];

    for(let k=0;k<3;k++){const ang=rot+k*2*PI/3+(Math.random()-0.5)*0.6,dd=380+Math.random()*380;const tx=S0.x+Math.cos(ang)*dd,ty=S0.y+Math.sin(ang)*dd;

function routeFrom(R,nids){const pts=nids.map(id=>{const n=R.nodes.get(id);return [n.x,n.y];});

/* ---------- 走行中の判定 ---------- */
function sigGroup(S2,heading){return Math.abs(Math.cos(heading-S2.axis))>0.7071?'A':'B';}

    const inside=d<S2.r;if(inside&&!st.in&&G.v>0.3){const toC=Math.atan2(S2.y-Fy,S2.x-Fx);const mv=Math.cos(toC-G.a);if(mv>0.3&&sigStateR(S2,sigGroup(S2,G.a))==='R')ev('red');}st.in=inside;}
  // 一時停止
  for(const s of R.stops){const d=(Fx-s.x)*s.dx+(Fy-s.y)*s.dy,lat=Math.abs((Fx-s.x)*-s.dy+(Fy-s.y)*s.dx),al=fx*s.dx+fy*s.dy;const key='t'+s.x.toFixed(0)+s.y.toFixed(0);

    if(lat>s.hw+1.5||al<0.5||d<-16||d>5){st.pd=null;st.near=st.far=st.L=st.R=false;continue;}
    if(d<1&&d>-4&&sp<0.05)st.near=true;if(d<=-4&&d>-14&&sp<0.05)st.far=true;

    const key='x'+c.x.toFixed(0)+c.y.toFixed(0)+sx;const st=G.slState[key]||(G.slState[key]={pd:null,near:false,L:false,R:false});

/* ---------- 交通（ほかの車・歩行者・列車） ---------- */
let TF=null;  // {cars,peds,train}

function edgeList(R){if(R.edges)return R.edges;const E=[];for(const [a,L] of R.adj){const na=R.nodes.get(a);for(const e of L){const nb=R.nodes.get(e.to);if(!na||!nb)continue;E.push({a,b:e.to,len:e.len,hw:e.hw||2.5,ow:e.ow||0,lim:e.lim||30,mx:(na.x+nb.x)/2,my:(na.y+nb.y)/2});}}R.edges=E;return E;}

function linePt(ln,s){s=clamp(s,0,ln.len);let i=1;while(i<ln.cum.length-1&&ln.cum[i]<s)i++;const k=(s-ln.cum[i-1])/((ln.cum[i]-ln.cum[i-1])||1);const a=ln.L[i-1],b=ln.L[i];return [a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k,Math.atan2(b[1]-a[1],b[0]-a[0])];}

function pedPos(p){const c=p.c,nx=-c.dy,ny=c.dx;return [c.x+nx*p.o,c.y+ny*p.o];}

function sampleOSM(){const lat0=33.20,lon0=130.20,kx=111320*Math.cos(lat0*PI/180),ky=110540;const LL=(x,y)=>({lat:lat0-y/ky,lon:lon0+x/kx});
  const el=[],ids=new Map();let nid=1,wid=1;const node=(x,y,tags)=>{const k=Math.round(x*10)+','+Math.round(y*10);let id=ids.get(k);if(!id){id=nid++;ids.set(k,id);const n={type:'node',id,...LL(x,y)};if(tags)n.tags=tags;el.push(n);}else if(tags){const n=el.find(e=>e.type==='node'&&e.id===id);n.tags=Object.assign(n.tags||{},tags);}return id;};
  const way=(pts,tags)=>{const nodes=pts.map(([x,y,tg])=>node(x,y,tg));el.push({type:'way',id:wid++,nodes,geometry:pts.map(([x,y])=>LL(x,y)),tags});};
  const G2=[-440,-330,-220,-110,0,110,220,330,440];
  // 大通り（東西 y=0、南北 x=0）、2車線、信号
  for(let i=0;i<G2.length-1;i++){const m=(G2[i]+G2[i+1])/2;way([[G2[i],0],[m,0],[G2[i+1],0]],{highway:'secondary',lanes:'2',maxspeed:'50',name:'サンプル大通り'});way([[0,G2[i]],[0,m],[0,G2[i+1]]],{highway:'secondary',lanes:'2',maxspeed:'40',name:'サンプル中央通り'});}
  for(const [x,y] of [[0,0],[-220,0],[220,0],[0,-220],[0,220]])node(x,y,{highway:'traffic_signals'});
  // 住宅街の道（中央線なし）。大通りに出る手前に一時停止
  for(const y of G2){if(y===0)continue;for(let i=0;i<G2.length-1;i++){const tg={highway:'residential'};if(y===-220)Object.assign(tg,{oneway:'yes',name:'一方通行の道'});
      const a=G2[i],b=G2[i+1];const pts=[[a,y]];if(a===0)pts.push([a+12,y,{highway:'stop'}]);if(b===0)pts.push([b-12,y,{highway:'stop'}]);pts.push([b,y]);
      if(Math.abs(y)===220&&(a===-220||b===-220||a===220||b===220)){}  way(pts,tg);}}
  for(const x of G2){if(x===0)continue;for(let i=0;i<G2.length-1;i++){const a=G2[i],b=G2[i+1];const pts=[[x,a]];if(a===0)pts.push([x,a+12,{highway:'stop'}]);if(b===0)pts.push([x,b-12,{highway:'stop'}]);
      if(a<330&&b>330)pts.push([x,330,{railway:'level_crossing'}]);if(b===330)pts.push([x,330]);pts.push([x,b]);way(pts,{highway:'residential'});}}
  // 線路と踏切
  el.push({type:'way',id:wid++,nodes:[],geometry:[LL(-520,330),LL(520,330)],tags:{railway:'rail'}});
  for(const x of G2)node(x,330,{railway:'level_crossing'});
  // 大通りの横断歩道
  node(-165,0,{highway:'crossing'});node(165,0,{highway:'crossing'});node(0,-165,{highway:'crossing'});node(0,165,{highway:'crossing'});
  // 教習所
  node(-330,-345,{amenity:'driving_school',name:'サンプル自動車学校（架空）'});
  // 建物
  let bi=0;for(let i=0;i<G2.length-1;i++)for(let j=0;j<G2.length-1;j++){const x0=G2[i],y0=G2[j];for(const [ox,oy,w,h] of [[14,14,36,30],[60,16,34,26],[16,62,30,32],[58,60,36,34]]){const lv=(bi++%5===0)?6:2;
    const p=[[x0+ox,y0+oy],[x0+ox+w,y0+oy],[x0+ox+w,y0+oy+h],[x0+ox,y0+oy+h],[x0+ox,y0+oy]];el.push({type:'way',id:wid++,nodes:[],geometry:p.map(([x,y])=>LL(x,y)),tags:{building:'yes','building:levels':String(lv)}});}}
  return {elements:el,center:{lat:lat0,lon:lon0}};}

function renderRoadScreen(){const B=$('#roadB');const A=AREA;
