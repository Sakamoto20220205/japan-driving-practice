   <div class="rrow"><button class="btn" id="rSchools">${t('r_loadSchools')}</button><button class="btn" id="rHere">📍 ${t('r_here')}</button><button class="btn" id="rSample">${t('r_sample')}</button></div>
   <div class="rrow"><input id="rQ" placeholder="${t('r_search')}"><button class="btn" id="rQBtn">${t('r_searchBtn')}</button></div>
   <div id="rList" class="rlist"></div><div class="kmsg" id="rMsg"></div><p class="muted" style="margin:4px 0 0;font-size:12.5px">${t('r_noteRoute')}</p></div>
   ${A?`<div class="rbox"><b>${t('r_route')}</b> <span class="muted" style="font-size:13px">${t('r_area',A.label,A.ways.length,A.sig.length,A.stops.length,A.lx.length)}</span>
   <p class="muted" style="margin:2px 0;font-size:13px">${t('r_tapHelp')}</p>
   <div class="rrow"><button class="btn" id="rAuto">🎲 ${t('r_auto')}</button><button class="btn" id="rUndo">↶ ${t('r_undo')}</button><button class="btn" id="rClear">✕ ${t('r_clear')}</button>
   <label class="btn" style="cursor:pointer">📂 ${t('r_gpx')}<input type="file" id="rGpx" accept=".gpx,application/gpx+xml" hidden></label><button class="btn" id="rShare">🔗 ${t('r_share')}</button></div>
   <canvas id="rMap"></canvas><div id="rInfo" class="muted" style="font-size:13.5px"></div>
   <label style="font-size:14px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="rTraffic" ${RS.traffic?'checked':''}> ${t('r_traffic')}</label>
   <div class="rrow"><button class="btn pri" id="rPractice">${t('r_practice')}</button><button class="btn pri" id="rExam" style="background:#4d2a2a;border-color:var(--red)">${t('r_exam')}</button></div>
   <div class="muted" style="font-size:12px">${t('r_attr')}</div></div>`:''}`;
  $('#rSchools').onclick=loadSchools;$('#rSample').onclick=()=>useArea(buildRoadWorld(sampleOSM(),{lat:33.20,lon:130.20},t('r_sampleName'),600),{x:-330,y:-345});
  $('#rHere').onclick=()=>{if(!navigator.geolocation){roadMsg(t('r_fail'),true);return;}roadMsg(t('r_loading'));navigator.geolocation.getCurrentPosition(p=>openArea(p.coords.latitude,p.coords.longitude,t('r_here')),()=>roadMsg(t('r_geoFail'),true),{timeout:15000});};
  const doSearch=async()=>{const q=$('#rQ').value.trim();if(!q)return;roadMsg('…');try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&countrycodes=jp&accept-language=ja&q='+encodeURIComponent(q));const js=await r.json();
      if(!js.length){roadMsg(t('r_none'),true);return;}roadMsg('');$('#rList').innerHTML=js.map((p,i)=>`<button class="item" data-i="${i}"><span class="tx"><b>${(p.name||p.display_name).replace(/[<>&"]/g,'')}</b><span>${p.display_name.replace(/[<>&"]/g,'').slice(0,90)}</span></span></button>`).join('');
      $$('#rList [data-i]').forEach(b=>b.onclick=()=>{const p=js[+b.dataset.i];openArea(+p.lat,+p.lon,p.name||p.display_name.split(',')[0]);});}catch(e){roadMsg(t('r_fail'),true);}};
  $('#rQBtn').onclick=doSearch;$('#rQ').onkeydown=e=>{if(e.key==='Enter')doSearch();};
  if(A)setupRouteEditor();}
async function loadSchools(){roadMsg(t('r_loading'));try{const [s,w,n,e]=SAGA_BB;const js=await overpass(`[out:json][timeout:30];nwr["amenity"="driving_school"](${s},${w},${n},${e});out center tags;`);
  const L=(js.elements||[]).map(el=>({name:(el.tags&&el.tags.name)||'(名称なし)',lat:el.lat||(el.center&&el.center.lat),lon:el.lon||(el.center&&el.center.lon),addr:el.tags&&(el.tags['addr:city']||'')})).filter(p=>p.lat).sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  if(!L.length){roadMsg(t('r_none'),true);return;}roadMsg(t('r_schoolsNote',L.length));
  $('#rList').innerHTML=L.map((p,i)=>`<button class="item" data-i="${i}"><span class="tx"><b>🚗 ${p.name.replace(/[<>&"]/g,'')}</b><span>${p.lat.toFixed(4)}, ${p.lon.toFixed(4)}</span></span></button>`).join('');
  $$('#rList [data-i]').forEach(b=>b.onclick=()=>{const p=L[+b.dataset.i];openArea(p.lat,p.lon,p.name);});}catch(e){roadMsg(t('r_fail'),true);}}
async function openArea(lat,lon,label,half,then){roadMsg(t('r_loading'));try{const R=await loadArea(lat,lon,label,half);useArea(R,{x:0,y:0});if(then)then(R);}catch(e){roadMsg(t('r_fail'),true);}}
function useArea(R,start){AREA=R;RS.taps=[];RS.route=null;RS.start=start||{x:0,y:0};RS.view=null;renderRoadScreen();roadMsg('');}
function setupRouteEditor(){const c=$('#rMap');const R=AREA;const img=roadMapImage(R);
  const fit=()=>{const r=c.getBoundingClientRect();const dpr=Math.min(2,devicePixelRatio||1);c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);
    if(!RS.view){const [x0,y0,x1,y1]=R.bounds;const s=Math.min(c.width/(x1-x0+60),c.height/(y1-y0+60));RS.view={cx:(x0+x1)/2,cy:(y0+y1)/2,s};}};
  const toW=(px,py)=>{const r=c.getBoundingClientRect();const k=c.width/r.width;return [(px*k-c.width/2)/RS.view.s+RS.view.cx,(py*k-c.height/2)/RS.view.s+RS.view.cy];};
  const draw=()=>{if(!c.isConnected)return;fit();const x=c.getContext('2d');const V=RS.view;x.setTransform(1,0,0,1,0,0);x.fillStyle='#2c3e27';x.fillRect(0,0,c.width,c.height);
    x.setTransform(V.s,0,0,V.s,c.width/2-V.cx*V.s,c.height/2-V.cy*V.s);x.save();x.translate(-img.ox/img.sc,-img.oy/img.sc);x.scale(1/img.sc,1/img.sc);x.drawImage(img.c,0,0);x.restore();
    for(const S2 of R.sig){x.beginPath();x.arc(S2.x,S2.y,Math.max(4/V.s,3),0,7);x.fillStyle='#ff4a3a';x.fill();}
    for(const s of R.stops)drawStopIcon(x,s.x,s.y,Math.max(10/V.s,4));
    for(const c2 of R.lx){x.fillStyle='#ffd23a';x.fillRect(c2.x-Math.max(4/V.s,2),c2.y-Math.max(4/V.s,2),Math.max(8/V.s,4),Math.max(8/V.s,4));}
    if(RS.route){drawRouteLine(x,RS.route,0,'rgba(93,255,154,.85)',Math.max(4/V.s,2));const L=RS.route.legs;x.font=`bold ${12/V.s}px sans-serif`;x.textAlign='center';
      for(const g of L){if(g.k!=='turn')continue;x.fillStyle=g.sig==='L'?'#7fd0ff':'#ffb36b';x.beginPath();x.arc(g.p[0],g.p[1],7/V.s,0,7);x.fill();x.fillStyle='#111';x.fillText(g.sig==='L'?'←':'→',g.p[0],g.p[1]+4/V.s);}}
    RS.taps.forEach(([px,py],i)=>{x.beginPath();x.arc(px,py,9/V.s,0,7);x.fillStyle='#fff';x.fill();x.fillStyle='#111';x.font=`bold ${11/V.s}px sans-serif`;x.textAlign='center';x.fillText(i+1,px,py+4/V.s);});
    const st=RS.start;x.font=`${18/V.s}px sans-serif`;x.textAlign='center';x.fillText('🚗',st.x,st.y+6/V.s);
    const rt=RS.route;$('#rInfo').textContent=rt?t('r_len',(rt.len/1000).toFixed(1),rt.turns):t('r_noRoute');};
  RS.redraw=draw;
  let drag=null,pts=new Map();
  c.addEventListener('pointerdown',e=>{try{c.setPointerCapture(e.pointerId);}catch(_){}pts.set(e.pointerId,[e.clientX,e.clientY]);drag={x:e.clientX,y:e.clientY,moved:false,cx:RS.view.cx,cy:RS.view.cy,s:RS.view.s,d0:null};
    if(pts.size===2){const [a,b]=[...pts.values()];drag.d0=hyp(a[0]-b[0],a[1]-b[1]);}});
  c.addEventListener('pointermove',e=>{if(!drag||!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);const r=c.getBoundingClientRect(),k=c.width/r.width;
    if(pts.size===2&&drag.d0){const [a,b]=[...pts.values()];RS.view.s=clamp(drag.s*hyp(a[0]-b[0],a[1]-b[1])/drag.d0,0.05,8);drag.moved=true;draw();return;}
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(hyp(dx,dy)>6)drag.moved=true;if(drag.moved){RS.view.cx=drag.cx-dx*k/RS.view.s;RS.view.cy=drag.cy-dy*k/RS.view.s;draw();}});
  const up=e=>{if(!drag)return;const r=c.getBoundingClientRect();if(!drag.moved&&pts.size===1){const w=toW(e.clientX-r.left,e.clientY-r.top);RS.taps.push(w);updRoute();}pts.delete(e.pointerId);if(!pts.size)drag=null;};
  c.addEventListener('pointerup',up);c.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);drag=null;});
  c.addEventListener('wheel',e=>{e.preventDefault();RS.view.s=clamp(RS.view.s*(e.deltaY<0?1.2:1/1.2),0.05,8);draw();},{passive:false});
  const updRoute=()=>{const taps=RS.taps.length?[[RS.start.x,RS.start.y],...RS.taps]:[];RS.route=taps.length>=2?routeFromTaps(R,taps):null;if(RS.taps.length&&!RS.route)roadMsg(t('r_noPath'),true);else roadMsg('');draw();};
  $('#rAuto').onclick=()=>{RS.taps=[];RS.route=autoRoute(R,RS.start.x,RS.start.y);if(!RS.route)roadMsg(t('r_noPath'),true);draw();};
  $('#rUndo').onclick=()=>{RS.taps.pop();updRoute();};$('#rClear').onclick=()=>{RS.taps=[];RS.route=null;draw();};
  $('#rGpx').onchange=async e=>{const f=e.target.files[0];if(!f)return;const txt=await f.text();loadGpx(txt);};
  $('#rShare').onclick=()=>{const url=shareURL();try{navigator.clipboard.writeText(url).then(()=>roadMsg(t('r_copied')+'：'+url),()=>roadMsg(url));}catch(_){roadMsg(url);}};
  $('#rTraffic').onchange=e=>{RS.traffic=e.target.checked;};
  $('#rPractice').onclick=()=>{if(!RS.route){roadMsg(t('r_noRoute'),true);return;}startRoadRun('lesson');};
  $('#rExam').onclick=()=>{if(!RS.route){roadMsg(t('r_noRoute'),true);return;}startRoadRun('exam');};
  draw();}
function parseGpx(txt){const d=new DOMParser().parseFromString(txt,'application/xml');const pts=[...d.querySelectorAll('trkpt,rtept')].map(n=>[+n.getAttribute('lat'),+n.getAttribute('lon')]).filter(p=>isFinite(p[0])&&isFinite(p[1]));return pts;}
function loadGpx(txt){const ll=parseGpx(txt);if(ll.length<2){roadMsg(t('r_gpxBad'),true);return;}
  let s=90,w=180,n=-90,e=-180;ll.forEach(([a,b])=>{s=Math.min(s,a);n=Math.max(n,a);w=Math.min(w,b);e=Math.max(e,b);});const lat=(s+n)/2,lon=(w+e)/2;
  let half=Math.max((n-s)*110540,(e-w)*111320*Math.cos(lat*PI/180))/2+250;if(half>1600){roadMsg(t('r_gpxFar'),true);half=1600;}
  const go=R=>{const tr=ll.map(([a,b])=>R.toXY(a,b));RS.start={x:tr[0][0],y:tr[0][1]};RS.taps=[];RS.route=routeFromTrack(R,tr);if(!RS.route)roadMsg(t('r_noPath'),true);RS.redraw&&RS.redraw();};
  if(AREA&&ll.every(([a,b])=>{const [x,y]=AREA.toXY(a,b);return Math.abs(x)<AREA.half&&Math.abs(y)<AREA.half;})){go(AREA);return;}
  openArea(lat,lon,'GPX',half,go);}
function shareURL(){const A=AREA;if(!A)return location.href;const base=location.href.split('#')[0].split('?')[0];const r=[RS.start,...RS.taps.map(([x,y])=>({x,y}))].map(p=>{const q=A.toLL(p.x,p.y);return q.lat.toFixed(5)+','+q.lon.toFixed(5);}).join(';');
  return `${base}?lat=${A.center.lat.toFixed(5)}&lon=${A.center.lon.toFixed(5)}&name=${encodeURIComponent(A.label)}&r=${r}`;}
function openFromURL(){try{const q=new URLSearchParams(location.search);const lat=+q.get('lat'),lon=+q.get('lon');if(!lat||!lon)return;
  renderRoadScreen();show('scRoad');openArea(lat,lon,q.get('name')||'—',1000,R=>{const pts=(q.get('r')||'').split(';').map(s=>s.split(',').map(Number)).filter(p=>p.length===2&&p.every(isFinite)).map(([a,b])=>R.toXY(a,b));
    if(pts.length){RS.start={x:pts[0][0],y:pts[0][1]};RS.taps=pts.slice(1).map(p=>[p[0],p[1]]);const taps=[pts[0],...RS.taps];RS.route=taps.length>=2?routeFromTaps(R,taps):null;}renderRoadScreen();});}catch(e){}}

/* ---------- 公道で走り出す ---------- */
function startRoadRun(kind){RW=AREA;RW.route=RS.route;const rt=RW.route;const d0=rt.dense[0],d1=rt.dense[Math.min(3,rt.dense.length-1)];const a=Math.atan2(d1.y-d0.y,d1.x-d0.x);
  const here=roadSegAt(RW,d0.x,d0.y);const hw=here?here.s.hw:2.5;const off=here&&!here.s.ow?Math.min(hw*0.55,1.8):0;const lx=Math.sin(a),ly=-Math.cos(a);
  const sx=d0.x+lx*off-Math.cos(a)*1.3,sy=d0.y+ly*off-Math.sin(a)*1.3;
  const legs=[{k:'go',p:[rt.dense[Math.min(6,rt.dense.length-1)].x,rt.dense[Math.min(6,rt.dense.length-1)].y],m:kind==='exam'?'g_start':'g_roadStart',r:7,idx:6}].concat(rt.legs.map(L=>Object.assign({},L)));
  const end=rt.dense[rt.dense.length-1];legs.push(kind==='exam'?{k:'finish',p:[end.x,end.y],m:'g_finishRoad',idx:rt.dense.length-1}:{k:'stop',p:[end.x,end.y],m:'g_end',sr:7,idx:rt.dense.length-1});
  startRun({kind,id:'road',road:true,legsR:legs,spawnR:{x:sx,y:sy,a,gear:kind==='exam'?'P':'P',pb:true,belt:false,startCheck:true}});}

window.__jdp={get TF(){return TF;},roadTrainWarn,tirePts,inDrv,get RW(){return RW;},get AREA(){return AREA;},RS,sampleOSM,buildRoadWorld,useArea,startRoadRun,autoRoute,routeFromTaps,loadGpx,roadSegAt,sigStateR,sigGroup,get KEYMAP(){return KEYMAP;},openKeyEditor,SCH,renderSchool,startQuiz,get QZ(){return QZ;},S:S_PTS,get G(){return G;},W,startRun,inDrv,SL,tick,shift,wink,look,LESSONS,LEGS_A,LEGS_B,BAYS,trainInfo,sigState,keys,PED,endRun,QS,QR,QH,setLang:l=>{LANG=l;applyI18n();}};

applyI18n();requestAnimationFrame(loop);openFromURL();
